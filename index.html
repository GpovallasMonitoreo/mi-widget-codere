<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere Broadsign - Mundial Priorizado</title>
    <style>
        /* 1. EL FONDO: Forzado al 100% exacto del frame de Broadsign */
        html, body {
            margin: 0; 
            padding: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #0d1418;
            background-image: url('https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-09%20at%208.40.30%20PM.jpeg');
            background-size: 100% 100%; 
            background-repeat: no-repeat; 
            background-position: center; 
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
        }

        /* 2. EL MODAL: Posicionamiento elástico */
        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 70vh; 
            transform: translateY(-50%); 
            width: 85vw; 
            max-width: 320px; 
            background-color: #1a2024; 
            border-radius: 6px; 
            padding: 4vw; 
            color: #FFF; 
            box-shadow: 0px 10px 20px rgba(0,0,0,0.6);
            transition: all 0.3s ease-in-out; 
        }

        /* Sección del Marcador */
        .match-info { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 2vw; 
            border-bottom: 2px solid #3d4a22; 
            padding-bottom: 3vw; 
            margin-bottom: 3vw; 
        }
        
        .team-container { 
            display: flex; 
            align-items: center; 
            gap: 1.5vw; 
        }
        
        .team-name { 
            font-size: clamp(12px, 4.5vw, 18px); 
            font-weight: 900; 
            letter-spacing: 0.5px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot-local { background-color: #00C800; } 
        .dot-visita { background-color: #FFD700; } 

        .score-board { 
            font-size: clamp(24px, 8vw, 32px); 
            font-weight: 900; 
            display: flex; 
            align-items: center;
        }
        .score-board .separator { margin: 0 1vw; }

        /* Sección de Momios */
        .odds-title { 
            text-align: center; 
            font-size: clamp(9px, 3.5vw, 12px); 
            font-weight: 800;
            margin-bottom: 3vw; 
            letter-spacing: 0.5px; 
        }

        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #3d4a22; 
            padding: 2.5vw 0; 
        }
        
        .odd-row:last-child { 
            border-bottom: none; 
            padding-bottom: 0; 
        }

        .odd-label { 
            font-size: clamp(11px, 4vw, 15px); 
            font-weight: bold; 
        }
        
        .odd-value { 
            font-size: clamp(12px, 4.2vw, 16px); 
            font-weight: 900; 
        }

        /* Estilo para el estado de Partido Finalizado */
        .finished-text { 
            color: #00C800 !important; 
            font-size: clamp(13px, 4.5vw, 16px) !important; 
            margin-bottom: 0 !important; 
            padding-top: 2vw;
        }
        .live-text { color: #FF0000 !important; }
        .pre-text { color: #00E5FF !important; }
    </style>
</head>
<body>

    <div class="data-overlay" id="widget-datos">
        <div class="match-info" id="contenedor-marcador">
            <div class="team-container">
                <span class="dot dot-local"></span>
                <span class="team-name" id="equipo-local">---</span>
            </div>
            <div class="score-board">
                <span id="marcador-local">0</span>
                <span class="separator">-</span>
                <span id="marcador-visita">0</span>
            </div>
            <div class="team-container right">
                <span class="team-name" id="equipo-visita">---</span>
                <span class="dot dot-visita"></span>
            </div>
        </div>

        <h4 class="odds-title" id="titulo-seccion">&nbsp;</h4>
        
        <div class="odds-section" id="seccion-momios">
            <div class="odd-row">
                <span class="odd-label" id="label-gana-local">GANA LOCAL</span>
                <span class="odd-value" id="cuota-local">--</span>
            </div>
            <div class="odd-row">
                <span class="odd-label">EMPATE</span>
                <span class="odd-value" id="cuota-empate">--</span>
            </div>
            <div class="odd-row">
                <span class="odd-label" id="label-gana-visita">GANA VISITA</span>
                <span class="odd-value" id="cuota-visita">--</span>
            </div>
        </div>
    </div>

    <script>
        // EL OBJETIVO PRINCIPAL: ID DE COREA VS CHEQUIA
        const PARTIDO_PRIORIDAD_ID = "13177476190"; 
        
        let actualizacionEnProgreso = false;
        let partidosDisponibles = [];
        let indicePartidoActual = 0;
        let modoCarrusel = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 404 || response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) return null;
                return data;
            } catch (error) { return null; }
        }

        const formatMomio = (val) => {
            if (val == null || val === "" || val === "-") return "N/D";
            const strVal = val.toString();
            if (strVal.includes('.')) {
                const num = Number(val);
                return !isNaN(num) ? num.toFixed(2) : strVal;
            }
            const num = Number(val);
            if (isNaN(num)) return val;
            return num > 0 ? `+${num}` : num.toString();
        };

        const obtenerAbreviatura = (nombre) => {
            if (!nombre) return "---";
            const nombreLimpio = nombre.trim().toUpperCase();
            // Diccionario expandido con Croacia
            const diccionario = {
                "MÉXICO": "MEX", "MEXICO": "MEX", "SUDÁFRICA": "RSA", "SUDAFRICA": "RSA",
                "BRASIL": "BRA", "ARGENTINA": "ARG", "ALEMANIA": "GER", "ESPAÑA": "ESP",
                "INGLATERRA": "ENG", "FRANCIA": "FRA", "ESTADOS UNIDOS": "USA",
                "COREA": "KOR", "COREA DEL SUR": "KOR", "SOUTH KOREA": "KOR",
                "CHEQUIA": "CZE", "REPÚBLICA CHECA": "CZE", "REPUBLICA CHECA": "CZE", "CZECH REPUBLIC": "CZE",
                "CROACIA": "CRO", "CROATIA": "CRO"
            };
            return diccionario[nombreLimpio] || nombreLimpio.substring(0, 3);
        };

        // ESCÁNER CON FILTRO DE PRIORIDAD
        async function escanearPartidosMundial() {
            let resultado = { live: [], upcoming: [] };
            try {
                const sports = await fetchCodere('/sports');
                if (!sports) return resultado;
                const soccer = sports.find(s => s.Name === 'Fútbol' || s.Name === 'Soccer');
                if (!soccer) return resultado;

                const leaguesData = await fetchCodere(`/sports/${soccer.NodeId}/leagues`);
                if (!leaguesData) return resultado;
                
                let ligas = [];
                leaguesData.forEach(country => {
                    const countryLeagues = country.Leagues || country.leagues || country.Items || [];
                    if (Array.isArray(countryLeagues)) ligas.push(...countryLeagues);
                    else if (country.NodeId) ligas.push(country);
                });

                const ligasMundial = ligas.filter(l => l.Name && (l.Name.toUpperCase().includes('MUNDIAL') || l.Name.toUpperCase().includes('WORLD CUP')));
                
                for (let liga of ligasMundial) {
                    const enVivo = await fetchCodere(`/leagues/${liga.NodeId}/liveEvents`);
                    if (Array.isArray(enVivo)) resultado.live.push(...enVivo.map(e => ({...e, isLive: true})));

                    const proximos = await fetchCodere(`/leagues/${liga.NodeId}/nonLiveEvents`);
                    if (Array.isArray(proximos)) resultado.upcoming.push(...proximos.map(e => ({...e, isLive: false})));
                }

                // ORDENAMIENTO MAESTRO: Si existe Corea vs Chequia, lo empujamos al inicio de la fila
                resultado.live.sort((a, b) => a.NodeId === PARTIDO_PRIORIDAD_ID ? -1 : (b.NodeId === PARTIDO_PRIORIDAD_ID ? 1 : 0));
                resultado.upcoming.sort((a, b) => a.NodeId === PARTIDO_PRIORIDAD_ID ? -1 : (b.NodeId === PARTIDO_PRIORIDAD_ID ? 1 : 0));

                return resultado;
            } catch (err) { return resultado; }
        }

        function procesarMomios(arrayEventos) {
            let cuotas = { cuotaL: "N/D", cuotaE: "N/D", cuotaV: "N/D" };
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) return cuotas;
            
            const juegos = arrayEventos.filter(i => i.Value && i.Value.Type === "Game").map(i => i.Value);
            const resultados = arrayEventos.filter(i => i.Value && i.Value.Type === "Result").map(i => i.Value);

            let mercadoPrincipal = juegos.find(j => j.GameType === 1 || j.GameType === 97 || j.GameType === 159) || 
                                   juegos.find(j => j.NodeName && j.NodeName.toUpperCase().includes("RESULTADO"));

            if (mercadoPrincipal) {
                const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
                resultadosMercado.sort((a, b) => {
                    try {
                        let orderA = parseInt(a.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                        let orderB = parseInt(b.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                        return orderA - orderB;
                    } catch(e){ return 0; }
                });

                if (resultadosMercado.length >= 3) {
                    cuotas.cuotaL = formatMomio(resultadosMercado[0].AmericanOdds || resultadosMercado[0].Odd || resultadosMercado[0].Price);
                    cuotas.cuotaE = formatMomio(resultadosMercado[1].AmericanOdds || resultadosMercado[1].Odd || resultadosMercado[1].Price);
                    cuotas.cuotaV = formatMomio(resultadosMercado[2].AmericanOdds || resultadosMercado[2].Odd || resultadosMercado[2].Price);
                }
            }
            return cuotas;
        }

        function renderizarPartidoActivo(partido, momios) {
            let equipos = partido.Name ? partido.Name.split(" - ") : ["LOCAL", "VISITA"];
            let local = obtenerAbreviatura(equipos[0]);
            let visita = obtenerAbreviatura(equipos[1]);
            let scoreL = partido.HomeScore != null ? partido.HomeScore : "0";
            let scoreV = partido.AwayScore != null ? partido.AwayScore : "0";

            // Grabamos en disco
            const memoria = { local, visita, scoreL, scoreV };
            localStorage.setItem('ultimoPartidoCodere', JSON.stringify(memoria));
            localStorage.setItem('ultimoPartidoCodere_wasLive', partido.isLive ? "true" : "false");

            document.getElementById('equipo-local').innerText = local;
            document.getElementById('equipo-visita').innerText = visita;
            document.getElementById('marcador-local').innerText = scoreL;
            document.getElementById('marcador-visita').innerText = scoreV;
            document.getElementById('label-gana-local').innerText = `GANA ${local}`;
            document.getElementById('label-gana-visita').innerText = `GANA ${visita}`;
            document.getElementById('cuota-local').innerText = momios.cuotaL;
            document.getElementById('cuota-empate').innerText = momios.cuotaE;
            document.getElementById('cuota-visita').innerText = momios.cuotaV;

            const titulo = document.getElementById('titulo-seccion');
            titulo.innerText = "OPCIONES DE APUESTA";
            titulo.className = "odds-title";
            
            document.getElementById('seccion-momios').style.display = 'block';
            document.getElementById('contenedor-marcador').style.borderBottom = "2px solid #3d4a22";
            document.getElementById('contenedor-marcador').style.paddingBottom = "3vw";
            document.getElementById('contenedor-marcador').style.marginBottom = "3vw";
        }

        function renderizarPartidoFinalizado(local, visita, scoreL, scoreV) {
            document.getElementById('equipo-local').innerText = local;
            document.getElementById('equipo-visita').innerText = visita;
            document.getElementById('marcador-local').innerText = scoreL;
            document.getElementById('marcador-visita').innerText = scoreV;

            document.getElementById('contenedor-marcador').style.borderBottom = "none";
            document.getElementById('contenedor-marcador').style.marginBottom = "0";
            document.getElementById('contenedor-marcador').style.paddingBottom = "0";
            document.getElementById('seccion-momios').style.display = 'none';
            
            const titulo = document.getElementById('titulo-seccion');
            titulo.innerText = "PARTIDO FINALIZADO";
            titulo.className = "odds-title finished-text";
        }

        async function cicloPrincipal() {
            if (actualizacionEnProgreso) return;
            actualizacionEnProgreso = true;

            try {
                // 1. REGLA DE LOS 10 MINUTOS 
                const horaFinalStr = localStorage.getItem('horaFinalPartido');
                if (horaFinalStr) {
                    const tiempoPasado = Date.now() - parseInt(horaFinalStr);
                    if (tiempoPasado < 600000) { // 600,000 milisegundos = 10 minutos
                        const memo = JSON.parse(localStorage.getItem('ultimoPartidoCodere'));
                        if (memo) renderizarPartidoFinalizado(memo.local, memo.visita, memo.scoreL, memo.scoreV);
                        actualizacionEnProgreso = false;
                        return; 
                    } else {
                        localStorage.removeItem('horaFinalPartido'); 
                    }
                }

                // 2. Extraer datos frescos
                const partidos = await escanearPartidosMundial();

                if (partidos.live.length > 0) {
                    // PARTIDO EN VIVO
                    modoCarrusel = false;
                    localStorage.removeItem('horaFinalPartido'); 

                    const partidoVivo = partidos.live[0];
                    const detalles = await fetchCodere(`/events/${partidoVivo.NodeId}`);
                    const momios = procesarMomios(detalles);
                    renderizarPartidoActivo(partidoVivo, momios);

                } else if (partidos.upcoming.length > 0) {
                    // PARTIDOS PROGRAMADOS (Pre-Match)
                    const ultimoLive = localStorage.getItem('ultimoPartidoCodere_wasLive');
                    if (ultimoLive === "true") {
                        localStorage.setItem('horaFinalPartido', Date.now().toString());
                        localStorage.setItem('ultimoPartidoCodere_wasLive', "false");
                        const memo = JSON.parse(localStorage.getItem('ultimoPartidoCodere'));
                        if(memo) renderizarPartidoFinalizado(memo.local, memo.visita, memo.scoreL, memo.scoreV);
                        actualizacionEnProgreso = false;
                        return;
                    }

                    modoCarrusel = true;
                    partidosProgramados = partidos.upcoming;
                    
                    if(indicePartidoActual >= partidosProgramados.length) indicePartidoActual = 0;
                    
                    const partidoPre = partidosProgramados[indicePartidoActual];
                    const detalles = await fetchCodere(`/events/${partidoPre.NodeId}`);
                    const momios = procesarMomios(detalles);
                    renderizarPartidoActivo(partidoPre, momios);

                } else {
                    // NO HAY PARTIDOS EN LA API
                    const ultimoLive = localStorage.getItem('ultimoPartidoCodere_wasLive');
                    if (ultimoLive === "true") {
                        localStorage.setItem('horaFinalPartido', Date.now().toString());
                        localStorage.setItem('ultimoPartidoCodere_wasLive', "false");
                    }
                    const memo = JSON.parse(localStorage.getItem('ultimoPartidoCodere'));
                    if (memo) renderizarPartidoFinalizado(memo.local, memo.visita, memo.scoreL, memo.scoreV);
                }
            } catch (error) {
                console.error("Error en ciclo principal: ", error);
            } finally {
                actualizacionEnProgreso = false;
            }
        }

        // CARRUSEL: Rota cada 15 segundos entre los partidos programados
        function iniciarCarrusel() {
            setInterval(() => {
                if (modoCarrusel && partidosProgramados.length > 1) {
                    indicePartidoActual = (indicePartidoActual + 1) % partidosProgramados.length;
                    cicloPrincipal(); 
                }
            }, 15000);
        }

        // ARRANQUE
        cicloPrincipal();
        setInterval(cicloPrincipal, 30000);
        iniciarCarrusel();
    </script>
</body>
</html>
