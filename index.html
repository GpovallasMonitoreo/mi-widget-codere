<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Codere Automático</title>
    <style>
        /* ==========================================
           ESTILOS CSS (Diseño general y Posicionamiento)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Evita scroll en pantallas de monitoreo */
        }

        /* Contenedor principal que simula la proporción de la pantalla vertical */
        .pantalla-display {
            position: relative;
            width: 100%;
            max-width: 1080px; /* Resolución típica de vallas (ajusta según tu hardware) */
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* La imagen de fondo (tu arte limpio) */
        .fondo-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que la imagen llene el espacio sin deformarse */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* La caja del widget dinámico (flotando sobre la imagen) */
        .data-overlay {
            position: absolute;
            z-index: 2;
            
            /* AJUSTA ESTOS VALORES PARA CUADRAR EL WIDGET EXACTO EN TU ARTE */
            bottom: 18%; /* Qué tan abajo está el widget */
            left: 50%;
            transform: translateX(-50%); /* Centrado perfecto horizontal */
            width: 85%; /* Ancho de la caja negra */
            max-width: 500px;
            
            background-color: rgba(15, 25, 30, 0.95);
            border-radius: 20px;
            padding: 30px;
            color: #FFF;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }

        /* ==========================================
           ESTILOS CSS (Tipografía y colores del Widget)
           ========================================== */
        .league-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Layout del Marcador */
        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .team {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            width: 35%;
        }

        .team.right {
            justify-content: flex-end;
            text-align: right;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            margin: 0 10px;
            flex-shrink: 0;
        }
        .dot-local { background-color: #FAFF00; }
        .dot-visita { background-color: #FF0000; }

        .score-board {
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            width: 30%;
        }
        .score-board .separator {
            margin: 0 12px;
        }

        /* Layout de las Cuotas */
        .odds-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .odd-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            padding: 15px 0;
            font-size: 16px;
            font-weight: bold;
        }
        .odd-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .odd-value {
            color: #FFF;
        }
        
        .loading {
            text-align: center;
            color: #FAFF00;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="pantalla-display">
        
        <img src="fondo-codere.jpg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div id="estado-carga" class="loading">Conectando con Vercel Proxy...</div>
            
            <h3 class="league-title" id="titulo-liga">FÚTBOL - CARGANDO...</h3>

            <div class="match-info">
                <div class="team">
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">---</span>
                </div>
                
                <div class="score-board">
                    <span id="marcador-local">0</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">0</span>
                </div>

                <div class="team right">
                    <span id="equipo-visita">---</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>
                
                <div class="odd-row">
                    <span id="label-gana-local">GANA LOCAL</span>
                    <span class="odd-value" id="cuota-local">0.00</span>
                </div>
                <div class="odd-row">
                    <span>EMPATE</span>
                    <span class="odd-value" id="cuota-empate">0.00</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA VISITA</span>
                    <span class="odd-value" id="cuota-visita">0.00</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Función de conexión al proxy en Vercel
        async function fetchCodere(endpoint) {
            try {
                const response = await fetch(`/api/proxy?endpoint=${encodeURIComponent(endpoint)}`);
                if (response.status === 204) return null; 
                
                const data = await response.json();
                if (!response.ok) {
                    console.error("Error de Codere:", data);
                    throw new Error(`Codere Status: ${response.status}`);
                }
                return data;
            } catch (error) {
                console.error(`Error en ${endpoint}:`, error);
                throw error; 
            }
        }

        // Función principal con el buscador inteligente
        async function actualizarDatosSolos() {
            const estadoCarga = document.getElementById('estado-carga');
            
            try {
                estadoCarga.style.display = 'block';

                // PASO 1: Buscar Fútbol
                estadoCarga.innerText = "Buscando Deportes...";
                const deportes = await fetchCodere('/sports');
                if (!deportes) throw new Error("Fallo de conexión o API en actualización.");
                
                const futbol = deportes.find(d => d.Name === "Fútbol" || d.Name === "Soccer");
                if (!futbol) throw new Error("No se encontró el deporte Fútbol.");

                // PASO 2: Buscar Ligas
                estadoCarga.innerText = "Buscando Ligas...";
                const ligas = await fetchCodere(`/sports/${futbol.NodeId}/leagues`);
                if (!ligas || ligas.length === 0) throw new Error("No hay ligas disponibles.");

                // PASO 3: Buscador inteligente de partidos con prioridad a Liga MX
                estadoCarga.innerText = "Buscando partidos activos...";
                
                let ligaConEventos = null;
                let eventos = [];

                let ligasPrioritarias = ligas.filter(l => l.Name.toUpperCase().includes("LIGA MX"));
                let restoDeLigas = ligas.filter(l => !l.Name.toUpperCase().includes("LIGA MX"));
                let ligasAExplorar = [...ligasPrioritarias, ...restoDeLigas];

                for (let liga of ligasAExplorar) {
                    eventos = await fetchCodere(`/leagues/${liga.NodeId}/liveEvents`);
                    if (!eventos || eventos.length === 0) {
                        eventos = await fetchCodere(`/leagues/${liga.NodeId}/nonLiveEvents`);
                    }
                    if (eventos && eventos.length > 0) {
                        ligaConEventos = liga;
                        break; 
                    }
                }

                if (!ligaConEventos || eventos.length === 0) {
                    throw new Error("No hay partidos activos en ninguna liga en este momento.");
                }

                // PASO 4: Extraer información del partido
                const partidoActual = eventos[0];
                const equipos = partidoActual.Name.split(" - ");
                const nombreLocal = equipos[0] ? equipos[0].substring(0, 15) : "LOCAL"; 
                const nombreVisita = equipos[1] ? equipos[1].substring(0, 15) : "VISITA";

                // PASO 5: Extraer cuotas del mercado 1X2
                estadoCarga.innerText = "Calculando Cuotas...";
                const detallesEvento = await fetchCodere(`/events/${partidoActual.NodeId}`);
                const mercado1x2 = detallesEvento.Games.find(g => g.GameType === 1);
                
                let cuotaL = "N/D", cuotaE = "N/D", cuotaV = "N/D";

                if (mercado1x2 && mercado1x2.Results.length >= 3) {
                    cuotaL = mercado1x2.Results[0].Odds.toFixed(2);
                    cuotaE = mercado1x2.Results[1].Odds.toFixed(2);
                    cuotaV = mercado1x2.Results[2].Odds.toFixed(2);
                }

                // PASO 6: Actualizar Interfaz
                document.getElementById('titulo-liga').innerText = `FÚTBOL - ${ligaConEventos.Name.toUpperCase()}`;
                document.getElementById('equipo-local').innerText = nombreLocal.toUpperCase();
                document.getElementById('equipo-visita').innerText = nombreVisita.toUpperCase();
                document.getElementById('marcador-local').innerText = partidoActual.HomeScore || "0";
                document.getElementById('marcador-visita').innerText = partidoActual.AwayScore || "0";
                document.getElementById('label-gana-local').innerText = `GANA ${nombreLocal.toUpperCase()}`;
                document.getElementById('label-gana-visita').innerText = `GANA ${nombreVisita.toUpperCase()}`;
                document.getElementById('cuota-local').innerText = cuotaL;
                document.getElementById('cuota-empate').innerText = cuotaE;
                document.getElementById('cuota-visita').innerText = cuotaV;

                estadoCarga.style.display = 'none';

            } catch (error) {
                console.error(error);
                estadoCarga.innerText = error.message;
                estadoCarga.style.color = "#FF0000";
            }
        }

        // Ejecutar al iniciar
        actualizarDatosSolos();

        // Refresco cada 30 segundos
        setInterval(actualizarDatosSolos, 30000);

    </script>
</body>
</html>
