<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere - MEX vs RSA En Vivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { position: relative; width: 325px; height: 960px; background-color: #000; overflow: hidden; box-shadow: 0px 0px 20px rgba(0,0,0,0.5); }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 40%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 88%; 
            background-color: #171f24; 
            border-radius: 8px; 
            padding: 15px 20px; 
            color: #FFF; 
        }

        .match-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #7bc100; 
            padding-bottom: 12px; 
            margin-bottom: 15px; 
        }
        
        .team { display: flex; align-items: center; font-size: 18px; font-weight: bold; text-transform: uppercase; width: 40%; }
        .team.right { justify-content: flex-end; text-align: right; }
        
        .dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 8px; flex-shrink: 0; }
        .dot-local { background-color: #009900; } 
        .dot-visita { background-color: #FFD700; } 
        
        .score-board { font-size: 32px; font-weight: bold; display: flex; justify-content: center; width: 20%; color: #FFF; }
        .score-board .separator { margin: 0 6px; color: #FFF; }

        .odds-section { display: flex; flex-direction: column; }
        .odds-title { text-align: center; font-size: 14px; margin-bottom: 12px; color: #FFF; font-weight: bold; text-transform: uppercase; }
        
        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #7bc100; 
            padding: 8px 0; 
            font-size: 16px; 
            font-weight: bold; 
        }
        .odd-row:last-child { border-bottom: none; padding-bottom: 0; }
        .odd-value { color: #FFF; font-size: 20px; }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-09%20at%208.40.30%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div class="match-info">
                <div class="team">
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">MEX</span>
                </div>
                <div class="score-board">
                    <span id="marcador-local">0</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">0</span>
                </div>
                <div class="team right">
                    <span id="equipo-visita">RSA</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>
                <div class="odd-row">
                    <span id="label-gana-local">GANA MEX</span>
                    <span class="odd-value" id="cuota-local">-233</span>
                </div>
                <div class="odd-row">
                    <span id="label-empate">EMPATE</span>
                    <span class="odd-value" id="cuota-empate">+330</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA RSA</span>
                    <span class="odd-value" id="cuota-visita">+900</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let escaneoEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) return null; 
                return data;
            } catch (error) {
                return null; 
            }
        }

        const formatMomio = (val) => {
            if (val == null || val === "" || val === "-") return null;
            const strVal = val.toString();
            if (strVal.includes('.')) return strVal; 
            
            const num = Number(val);
            if (isNaN(num)) return val; 
            return num > 0 ? `+${num}` : num.toString(); 
        };

        const findNode = (obj, key) => {
            if (!obj || typeof obj !== 'object') return null;
            if (key in obj) return obj[key];
            for (let k in obj) {
                let res = findNode(obj[k], key);
                if (res) return res;
            }
            return null;
        };

        const getArray = (data, keyName) => {
            let items = findNode(data, keyName);
            if (!items) return [];
            return Array.isArray(items) ? items : [items];
        };

        const getProp = (obj, propNames) => {
            if (!obj) return null;
            for (let prop of propNames) {
                if (obj[`@${prop}`] !== undefined) return obj[`@${prop}`];
                if (obj[prop] !== undefined) return obj[prop];
            }
            return null;
        };

        async function actualizarDatosSolos() {
            if (escaneoEnProgreso) return;
            escaneoEnProgreso = true;

            try {
                // 1. Obtener Deporte (Fútbol)
                const sportsData = await fetchCodere('/getSportsMexico');
                const sports = getArray(sportsData, 'Sport');
                if (sports.length === 0) throw new Error("API offline o vacía");
                
                const futbol = sports.find(s => getProp(s, ['name', 'Name']) === "Fútbol" || getProp(s, ['sport_code', 'Code']) === "SOCCER") || sports[0];
                const sportCode = getProp(futbol, ['sport_code', 'Code', 'Id']);
                if (!sportCode) throw new Error("Estructura Sport inválida");

                // 2. Obtener Clase (Mundial 2026)
                const classesData = await fetchCodere(`/getClassesForSport/${sportCode}`);
                const classes = getArray(classesData, 'Class');
                if (classes.length === 0) throw new Error("Clases no disponibles");
                
                const claseMundial = classes.find(c => {
                    const name = getProp(c, ['name', 'Name']);
                    return name && name.includes("Mundial 2026");
                }) || classes[0];
                const classId = getProp(claseMundial, ['sb_class_id', 'Id']);
                if (!classId) throw new Error("ID de clase no encontrado");

                // 3. Obtener Tipo (Partidos)
                const typesData = await fetchCodere(`/getTypesForClass/${classId}`);
                const types = getArray(typesData, 'Type');
                if (types.length === 0) throw new Error("Tipos no disponibles");
                
                const tipoPartidos = types.find(t => {
                    const name = getProp(t, ['name', 'Name']);
                    return name && name.includes("Partidos");
                }) || types[0];
                const typeId = getProp(tipoPartidos, ['sb_type_id', 'Id']);
                if (!typeId) throw new Error("ID de tipo no encontrado");

                // 4. Obtener Evento (México v Sudáfrica)
                const eventsData = await fetchCodere(`/getEventsForType/${typeId}`);
                const events = getArray(eventsData, 'Event');
                if (events.length === 0) throw new Error("Eventos vacíos");
                
                const eventoMexico = events.find(ev => {
                    const name = getProp(ev, ['name', 'Name', 'event_name']);
                    return name && (name.toUpperCase().includes("MÉXICO") || name.toUpperCase().includes("MEX"));
                });
                
                // Si el evento no está listo en la API, se detiene aquí y preserva el Fallback de la pantalla
                if (!eventoMexico) {
                    console.log("Evento MEX vs RSA no abierto en API. Usando datos de respaldo.");
                    escaneoEnProgreso = false;
                    return; 
                }

                const evId = getProp(eventoMexico, ['ev_id', 'Id']);
                if (!evId) throw new Error("ID de evento no encontrado");

                // 5. Obtener Mercados del Evento
                const marketsData = await fetchCodere(`/getMarketsByEvent/${evId}`);
                const markets = getArray(marketsData, 'Market');
                if (markets.length === 0) throw new Error("Mercados vacíos");
                
                const mercado1x2 = markets.find(m => {
                    const name = getProp(m, ['name', 'Name']);
                    return name && (name.includes("1X2") || name.includes("Ganador") || name.includes("Match Betting"));
                }) || markets[0];
                
                const resultados = getArray(mercado1x2, 'Selection') || getArray(mercado1x2, 'Result') || [];

                // 6. Inyectar datos en tiempo real detectados de la API
                if (resultados.length >= 3) {
                    const getOdd = (res) => getProp(res, ['us', 'AmericanOdds', 'odd', 'Odd', 'price', 'dec']);

                    const cL = formatMomio(getOdd(resultados[0]));
                    const cE = formatMomio(getOdd(resultados[1]));
                    const cV = formatMomio(getOdd(resultados[2]));

                    if(cL) document.getElementById('cuota-local').innerText = cL;
                    if(cE) document.getElementById('cuota-empate').innerText = cE;
                    if(cV) document.getElementById('cuota-visita').innerText = cV;
                }

                // Conservar marcadores vivos si la API reporta goles pre-partido (inicialmente 0)
                const hScore = getProp(eventoMexico, ['HomeScore', 'home_score']);
                const aScore = getProp(eventoMexico, ['AwayScore', 'away_score']);
                if (hScore != null) document.getElementById('marcador-local').innerText = hScore;
                if (aScore != null) document.getElementById('marcador-visita').innerText = aScore;

            } catch (error) {
                console.log("Modo de Respaldo Activo:", error.message);
            } finally {
                escaneoEnProgreso = false;
            }
        }

        // Ejecución inmediata y bucle de refresco cada 30 segundos
        actualizarDatosSolos();
        setInterval(actualizarDatosSolos, 30000);
    </script>
</body>
</html>
