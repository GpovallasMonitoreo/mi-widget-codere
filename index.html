<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere - MEX vs RSA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { position: relative; width: 325px; height: 960px; background-color: #000; overflow: hidden; box-shadow: 0px 0px 20px rgba(0,0,0,0.5); }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 65%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 88%; 
            background-color: #171f24; 
            border-radius: 8px; 
            padding: 15px 20px; 
            color: #FFF; 
        }

        .match-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #7bc100; 
            padding-bottom: 12px; 
            margin-bottom: 15px; 
        }
        
        .team { display: flex; align-items: center; font-size: 18px; font-weight: bold; text-transform: uppercase; width: 40%; }
        .team.right { justify-content: flex-end; text-align: right; }
        
        .dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 8px; flex-shrink: 0; }
        .dot-local { background-color: #009900; } 
        .dot-visita { background-color: #FFD700; } 
        
        .score-board { font-size: 32px; font-weight: bold; display: flex; justify-content: center; width: 20%; color: #FFF; }
        .score-board .separator { margin: 0 6px; color: #FFF; }

        .odds-section { display: flex; flex-direction: column; }
        .odds-title { text-align: center; font-size: 14px; margin-bottom: 12px; color: #FFF; font-weight: bold; text-transform: uppercase; }
        
        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #7bc100; 
            padding: 8px 0; 
            font-size: 16px; 
            font-weight: bold; 
        }
        .odd-row:last-child { border-bottom: none; padding-bottom: 0; }
        .odd-value { color: #FFF; font-size: 20px; }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-09%20at%208.40.30%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div class="match-info">
                <div class="team">
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">MEX</span>
                </div>
                <div class="score-board">
                    <span id="marcador-local">-</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">-</span>
                </div>
                <div class="team right">
                    <span id="equipo-visita">RSA</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>
                <div class="odd-row">
                    <span id="label-gana-local">GANA MEX</span>
                    <span class="odd-value" id="cuota-local">-</span>
                </div>
                <div class="odd-row">
                    <span id="label-empate">EMPATE</span>
                    <span class="odd-value" id="cuota-empate">-</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA RSA</span>
                    <span class="odd-value" id="cuota-visita">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let escaneoEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) return null; 
                return data;
            } catch (error) {
                return null; 
            }
        }

        function extraerLigasDePaises(paisesResponse) {
            let ligasReales = [];
            if (!Array.isArray(paisesResponse)) return ligasReales;
            for (let pais of paisesResponse) {
                const posiblesLigas = pais.Leagues || pais.leagues || pais.Items || [];
                if (Array.isArray(posiblesLigas) && posiblesLigas.length > 0) {
                    ligasReales.push(...posiblesLigas);
                } else if (pais.NodeId && pais.Name) {
                    ligasReales.push(pais);
                }
            }
            return ligasReales;
        }

        function procesarArrayEventos(arrayEventos) {
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) {
                return { cuotaL: "-", cuotaE: "-", cuotaV: "-" };
            }
            const juegos = [];
            const resultados = [];
            for (let item of arrayEventos) {
                if (!item.Value) continue;
                const value = item.Value;
                if (value.Type === "Game") juegos.push(value);
                else if (value.Type === "Result") resultados.push(value);
            }
            
            let mercadoPrincipal = juegos.find(j => j.GameType === 97) || juegos.find(j => j.GameType === 1) || juegos[0];
            if (!mercadoPrincipal) return { cuotaL: "-", cuotaE: "-", cuotaV: "-" };
            
            const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
            if (resultadosMercado.length === 0) return { cuotaL: "-", cuotaE: "-", cuotaV: "-" };
            
            let cuotaL = "-", cuotaE = "-", cuotaV = "-";
            if (resultadosMercado.length >= 3) {
                cuotaL = resultadosMercado[0].Odd || resultadosMercado[0].Odds || resultadosMercado[0].Price || "-";
                cuotaE = resultadosMercado[1].Odd || resultadosMercado[1].Odds || resultadosMercado[1].Price || "-";
                cuotaV = resultadosMercado[2].Odd || resultadosMercado[2].Odds || resultadosMercado[2].Price || "-";
            }
            
            if (typeof cuotaL === 'number') cuotaL = cuotaL.toFixed(2);
            if (typeof cuotaE === 'number') cuotaE = cuotaE.toFixed(2);
            if (typeof cuotaV === 'number') cuotaV = cuotaV.toFixed(2);
            return { cuotaL, cuotaE, cuotaV };
        }

        async function actualizarDatosSolos() {
            if (escaneoEnProgreso) return;
            escaneoEnProgreso = true;

            try {
                const deportes = await fetchCodere('/sports');
                if (!deportes || !Array.isArray(deportes)) throw new Error();

                const deporteFutbol = deportes.find(d => d.Name === "Fútbol" || d.Name === "Soccer");
                if (!deporteFutbol) throw new Error();

                const paisesResponse = await fetchCodere(`/sports/${deporteFutbol.NodeId}/leagues`);
                if (!paisesResponse) throw new Error();
                
                const ligasReales = extraerLigasDePaises(paisesResponse);
                
                let eventoMexico = null;

                for (let liga of ligasReales.slice(0, 15)) {
                    if (!liga.NodeId) continue;
                    const eventos = await fetchCodere(`/leagues/${liga.NodeId}/liveEvents`);
                    
                    if (eventos && Array.isArray(eventos)) {
                        // Mantenemos la búsqueda por "MEX" en el backend de Codere
                        eventoMexico = eventos.find(ev => ev.Name && (ev.Name.toUpperCase().includes("MEX") || ev.Name.toUpperCase().includes("MÉX")));
                        if (eventoMexico) break;
                    }
                }

                if (!eventoMexico) {
                    escaneoEnProgreso = false;
                    return; 
                }

                document.getElementById('marcador-local').innerText = eventoMexico.HomeScore != null ? eventoMexico.HomeScore : "0";
                document.getElementById('marcador-visita').innerText = eventoMexico.AwayScore != null ? eventoMexico.AwayScore : "0";

                const arrayEventos = await fetchCodere(`/events/${eventoMexico.NodeId}`);
                const cuotas = procesarArrayEventos(arrayEventos);
                
                if (cuotas.cuotaL !== "-") document.getElementById('cuota-local').innerText = cuotas.cuotaL;
                if (cuotas.cuotaE !== "-") document.getElementById('cuota-empate').innerText = cuotas.cuotaE;
                if (cuotas.cuotaV !== "-") document.getElementById('cuota-visita').innerText = cuotas.cuotaV;

            } catch (error) {
                // Falla silenciosa
            } finally {
                escaneoEnProgreso = false;
            }
        }

        actualizarDatosSolos();
        setInterval(actualizarDatosSolos, 60000);
    </script>
</body>
</html>
