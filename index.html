<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere Broadsign - Full Stretch Ajustado</title>
    <style>
        /* 1. EL FONDO: Forzado al 100% exacto del frame de Broadsign */
        html, body {
            margin: 0; 
            padding: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #0d1418;
            background-image: url('https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-05%20at%2012.17.23%20PM.jpeg');
            
            /* LA CLAVE PARA QUE SE VEA COMPLETO SIN REPETIRSE NI CORTARSE */
            background-size: 100% 100%; 
            background-repeat: no-repeat; 
            background-position: center; 
            
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
        }

        /* 2. EL MODAL: Posicionamiento elástico */
        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            /* AQUÍ ESTÁ EL AJUSTE: Cambiado de 55vh a 65vh para bajar el modal */
            top: 65vh; 
            transform: translateY(-50%); 
            width: 85vw; /* Se ajusta al ancho del tótem */
            max-width: 320px; 
            background-color: #1a2024; 
            border-radius: 6px; 
            padding: 4vw; 
            color: #FFF; 
            box-shadow: 0px 10px 20px rgba(0,0,0,0.6);
        }

        /* Sección del Marcador */
        .match-info { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 2vw; 
            border-bottom: 2px solid #3d4a22; 
            padding-bottom: 3vw; 
            margin-bottom: 3vw; 
        }
        
        .team-container { 
            display: flex; 
            align-items: center; 
            gap: 1.5vw; 
        }
        
        /* Fuentes elásticas para evitar desbordamientos */
        .team-name { 
            font-size: clamp(12px, 4.5vw, 18px); 
            font-weight: 900; 
            letter-spacing: 0.5px;
        }

        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot-local { background-color: #00C800; } 
        .dot-visita { background-color: #FFD700; } 

        .score-board { 
            font-size: clamp(24px, 8vw, 32px); 
            font-weight: 900; 
            display: flex; 
            align-items: center;
        }
        .score-board .separator { margin: 0 1vw; }

        /* Sección de Momios */
        .odds-title { 
            text-align: center; 
            font-size: clamp(9px, 3.5vw, 12px); 
            font-weight: 800;
            margin-bottom: 3vw; 
            letter-spacing: 0.5px; 
        }

        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #3d4a22; 
            padding: 2.5vw 0; 
        }
        
        .odd-row:last-child { 
            border-bottom: none; 
            padding-bottom: 0; 
        }

        .odd-label { 
            font-size: clamp(11px, 4vw, 15px); 
            font-weight: bold; 
        }
        
        .odd-value { 
            font-size: clamp(12px, 4.2vw, 16px); 
            font-weight: 900; 
        }
    </style>
</head>
<body>

    <div class="data-overlay" id="widget-datos">
        <div class="match-info">
            <div class="team-container">
                <span class="dot dot-local"></span>
                <span class="team-name">MEX</span>
            </div>
            <div class="score-board">
                <span id="marcador-local">0</span>
                <span class="separator">-</span>
                <span id="marcador-visita">0</span>
            </div>
            <div class="team-container">
                <span class="team-name">RSA</span>
                <span class="dot dot-visita"></span>
            </div>
        </div>

        <h4 class="odds-title">OPCIONES DE APUESTA</h4>
        
        <div class="odds-section">
            <div class="odd-row">
                <span class="odd-label">GANA MEX</span>
                <span class="odd-value" id="cuota-local">--</span>
            </div>
            <div class="odd-row">
                <span class="odd-label">EMPATE</span>
                <span class="odd-value" id="cuota-empate">--</span>
            </div>
            <div class="odd-row">
                <span class="odd-label">GANA RSA</span>
                <span class="odd-value" id="cuota-visita">--</span>
            </div>
        </div>
    </div>

    <script>
        const MEXICO_EVENT_ID = "13177428310"; 
        let actualizacionEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                return data;
            } catch (error) {
                return null;
            }
        }

        const formatMomio = (val) => {
            if (val == null || val === "" || val === "-") return "N/D";
            const strVal = val.toString();
            if (strVal.includes('.')) {
                const num = Number(val);
                return !isNaN(num) ? num.toFixed(2) : strVal;
            }
            const num = Number(val);
            if (isNaN(num)) return val;
            return num > 0 ? `+${num}` : num.toString();
        };

        function procesarDataDelPartido(arrayEventos) {
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) return null;
            
            let dataPartido = { marcadorLocal: 0, marcadorVisita: 0, cuotaL: "N/D", cuotaE: "N/D", cuotaV: "N/D" };
            const juegos = [];
            const resultados = [];

            for (let item of arrayEventos) {
                if (!item.Value) continue;
                if (item.Value.Type === "Event" && item.Value.NodeId === MEXICO_EVENT_ID) {
                    dataPartido.marcadorLocal = item.Value.HomeScore != null ? item.Value.HomeScore : 0;
                    dataPartido.marcadorVisita = item.Value.AwayScore != null ? item.Value.AwayScore : 0;
                } else if (item.Value.Type === "Game") {
                    juegos.push(item.Value);
                } else if (item.Value.Type === "Result") {
                    resultados.push(item.Value);
                }
            }

            let mercadoPrincipal = juegos.find(j => j.GameType === 1 || j.GameType === 97 || j.GameType === 159) || 
                                   juegos.find(j => j.NodeName && j.NodeName.toUpperCase().includes("RESULTADO"));

            if (mercadoPrincipal) {
                const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
                
                resultadosMercado.sort((a, b) => {
                    let orderA = 99, orderB = 99;
                    try {
                        orderA = parseInt(a.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                        orderB = parseInt(b.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                    } catch(e){}
                    return orderA - orderB;
                });

                if (resultadosMercado.length >= 3) {
                    let cL = resultadosMercado[0].AmericanOdds || resultadosMercado[0].Odd || resultadosMercado[0].Price || "N/D";
                    let cE = resultadosMercado[1].AmericanOdds || resultadosMercado[1].Odd || resultadosMercado[1].Price || "N/D";
                    let cV = resultadosMercado[2].AmericanOdds || resultadosMercado[2].Odd || resultadosMercado[2].Price || "N/D";

                    dataPartido.cuotaL = formatMomio(cL);
                    dataPartido.cuotaE = formatMomio(cE);
                    dataPartido.cuotaV = formatMomio(cV);
                }
            }
            return dataPartido;
        }

        async function actualizarDatosMexico() {
            if (actualizacionEnProgreso) return;
            actualizacionEnProgreso = true;

            try {
                const arrayEventos = await fetchCodere(`/events/${MEXICO_EVENT_ID}`);
                const datos = procesarDataDelPartido(arrayEventos);

                if (datos) {
                    document.getElementById('marcador-local').innerText = datos.marcadorLocal;
                    document.getElementById('marcador-visita').innerText = datos.marcadorVisita;
                    document.getElementById('cuota-local').innerText = datos.cuotaL;
                    document.getElementById('cuota-empate').innerText = datos.cuotaE;
                    document.getElementById('cuota-visita').innerText = datos.cuotaV;
                }
            } catch (error) {
                console.error("Error al actualizar datos: ", error);
            } finally {
                actualizacionEnProgreso = false;
            }
        }

        actualizarDatosMexico();
        setInterval(actualizarDatosMexico, 30000);
    </script>
</body>
</html>
