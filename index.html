<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere en Vivo</title>
    <style>
        /* ==========================================
           ESTILOS CSS (Diseño general y Posicionamiento)
           ========================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Evita scroll en la pantalla del tótem */
        }

        /* Contenedor principal con las medidas exactas solicitadas (325x960) */
        .pantalla-display {
            position: relative;
            width: 325px; 
            height: 960px;
            background-color: #000;
            overflow: hidden;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5); /* Sombra para resaltar en pruebas web */
        }

        /* La imagen de fondo jalada desde Supabase */
        .fondo-img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* La caja del widget dinámico (flotando exactamente en tu recuadro rojo) */
        .data-overlay {
            position: absolute;
            z-index: 2;
            
            /* Ajuste vertical y horizontal para caer en el espacio vacío */
            top: 59%; 
            left: 50%;
            transform: translateX(-50%); 
            width: 88%; /* Deja un margen natural a los lados */
            
            background-color: rgba(15, 25, 30, 0.95);
            border-radius: 12px;
            padding: 15px; /* Reducido para la resolución estrecha */
            color: #FFF;
        }

        /* ==========================================
           ESTILOS CSS (Tipografía adaptada a 325px de ancho)
           ========================================== */
        .league-title {
            text-align: center;
            font-size: 13px; /* Escala reducida */
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Layout del Marcador */
        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .team {
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            width: 38%;
        }

        .team.right {
            justify-content: flex-end;
            text-align: right;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin: 0 5px;
            flex-shrink: 0;
        }
        .dot-local { background-color: #FAFF00; }
        .dot-visita { background-color: #FF0000; }

        .score-board {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            width: 24%;
        }
        .score-board .separator {
            margin: 0 5px;
        }

        /* Layout de las Cuotas */
        .odds-title {
            text-align: center;
            font-size: 12px;
            margin-bottom: 10px;
            color: #ccc;
        }

        .odd-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #222;
            padding: 8px 0;
            font-size: 11px;
            font-weight: bold;
        }
        .odd-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .odd-value {
            color: #FFF;
            font-size: 12px;
        }
        
        .loading {
            text-align: center;
            color: #FAFF00;
            font-size: 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="pantalla-display">
        
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-05%20at%2012.17.23%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div id="estado-carga" class="loading">Sincronizando datos...</div>
            
            <h3 class="league-title" id="titulo-liga">FÚTBOL - CARGANDO...</h3>

            <div class="match-info">
                <div class="team">
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">---</span>
                </div>
                
                <div class="score-board">
                    <span id="marcador-local">0</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">0</span>
                </div>

                <div class="team right">
                    <span id="equipo-visita">---</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>
                
                <div class="odd-row">
                    <span id="label-gana-local">GANA LOCAL</span>
                    <span class="odd-value" id="cuota-local">0.00</span>
                </div>
                <div class="odd-row">
                    <span>EMPATE</span>
                    <span class="odd-value" id="cuota-empate">0.00</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA VISITA</span>
                    <span class="odd-value" id="cuota-visita">0.00</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        async function fetchCodere(endpoint) {
            try {
                const response = await fetch(`/api/proxy?endpoint=${encodeURIComponent(endpoint)}`);
                if (response.status === 204) return null; 
                
                const data = await response.json();
                if (!response.ok) {
                    console.error("Error de Codere:", data);
                    throw new Error(`Codere Status: ${response.status}`);
                }
                return data;
            } catch (error) {
                console.error(`Error en ${endpoint}:`, error);
                throw error; 
            }
        }

        async function actualizarDatosSolos() {
            const estadoCarga = document.getElementById('estado-carga');
            
            try {
                estadoCarga.style.display = 'block';

                // Buscar Fútbol
                const deportes = await fetchCodere('/sports');
                if (!deportes) throw new Error("Conectando con servidor...");
                
                const futbol = deportes.find(d => d.Name === "Fútbol" || d.Name === "Soccer");
                if (!futbol) throw new Error("Deporte no disponible.");

                // Buscar Ligas
                const ligas = await fetchCodere(`/sports/${futbol.NodeId}/leagues`);
                if (!ligas || ligas.length === 0) throw new Error("Sin ligas activas.");

                // Buscador inteligente con prioridad Liga MX
                let ligaConEventos = null;
                let eventos = [];

                let ligasPrioritarias = ligas.filter(l => l.Name.toUpperCase().includes("LIGA MX"));
                let restoDeLigas = ligas.filter(l => !l.Name.toUpperCase().includes("LIGA MX"));
                let ligasAExplorar = [...ligasPrioritarias, ...restoDeLigas];

                for (let liga of ligasAExplorar) {
                    eventos = await fetchCodere(`/leagues/${liga.NodeId}/liveEvents`);
                    if (!eventos || eventos.length === 0) {
                        eventos = await fetchCodere(`/leagues/${liga.NodeId}/nonLiveEvents`);
                    }
                    if (eventos && eventos.length > 0) {
                        ligaConEventos = liga;
                        break; 
                    }
                }

                if (!ligaConEventos || eventos.length === 0) {
                    throw new Error("Sin partidos programados.");
                }

                // Extraer información del partido (Acortado a 12 caracteres por el ancho de la pantalla)
                const partidoActual = eventos[0];
                const equipos = partidoActual.Name.split(" - ");
                const nombreLocal = equipos[0] ? equipos[0].substring(0, 12).trim() : "LOCAL"; 
                const nombreVisita = equipos[1] ? equipos[1].substring(0, 12).trim() : "VISITA";

                // Extraer cuotas
                const detallesEvento = await fetchCodere(`/events/${partidoActual.NodeId}`);
                const mercado1x2 = detallesEvento.Games.find(g => g.GameType === 1);
                
                let cuotaL = "N/D", cuotaE = "N/D", cuotaV = "N/D";

                if (mercado1x2 && mercado1x2.Results.length >= 3) {
                    cuotaL = mercado1x2.Results[0].Odds.toFixed(2);
                    cuotaE = mercado1x2.Results[1].Odds.toFixed(2);
                    cuotaV = mercado1x2.Results[2].Odds.toFixed(2);
                }

                // Inyectar en Interfaz
                document.getElementById('titulo-liga').innerText = `FÚTBOL - ${ligaConEventos.Name.toUpperCase()}`;
                document.getElementById('equipo-local').innerText = nombreLocal.toUpperCase();
                document.getElementById('equipo-visita').innerText = nombreVisita.toUpperCase();
                document.getElementById('marcador-local').innerText = partidoActual.HomeScore || "0";
                document.getElementById('marcador-visita').innerText = partidoActual.AwayScore || "0";
                document.getElementById('label-gana-local').innerText = `GANA ${nombreLocal.toUpperCase()}`;
                document.getElementById('label-gana-visita').innerText = `GANA ${nombreVisita.toUpperCase()}`;
                document.getElementById('cuota-local').innerText = cuotaL;
                document.getElementById('cuota-empate').innerText = cuotaE;
                document.getElementById('cuota-visita').innerText = cuotaV;

                estadoCarga.style.display = 'none';

            } catch (error) {
                console.error(error);
                estadoCarga.innerText = error.message;
                estadoCarga.style.color = "#FF0000";
            }
        }

        // Arranque y loop
        actualizarDatosSolos();
        setInterval(actualizarDatosSolos, 30000); // 30 segundos

    </script>
</body>
</html>
