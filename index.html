<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere - MEX vs RSA En Vivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { 
            position: relative; 
            width: 1680px; 
            height: 540px; 
            background-color: #000; 
            overflow: hidden; 
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5); 
        }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Widget posicionado a la izquierda */
        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 50%; 
            left: 36%; 
            transform: translateY(-50%); 
            width: 480px; 
            background-color: #171f24; 
            border-radius: 12px; 
            padding: 30px; 
            color: #FFF; 
        }

        .match-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #7bc100; 
            padding-bottom: 20px; 
            margin-bottom: 25px; 
        }
        
        /* Aumento de tamaño en nombres de equipo */
        .team { display: flex; align-items: center; font-size: 24px; font-weight: bold; text-transform: uppercase; width: 40%; }
        .team.right { justify-content: flex-end; text-align: right; }
        
        .dot { width: 16px; height: 16px; border-radius: 50%; margin: 0 10px; flex-shrink: 0; }
        .dot-local { background-color: #009900; } 
        .dot-visita { background-color: #FFD700; } 
        
        /* Aumento de tamaño en marcador */
        .score-board { font-size: 52px; font-weight: 800; display: flex; justify-content: center; width: 20%; color: #FFF; }
        .score-board .separator { margin: 0 10px; color: #FFF; }

        .odds-section { display: flex; flex-direction: column; }
        .odds-title { text-align: center; font-size: 18px; margin-bottom: 20px; color: #FFF; font-weight: bold; text-transform: uppercase; }
        
        /* Aumento de tamaño en las opciones de apuesta */
        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #7bc100; 
            padding: 15px 0; 
            font-size: 20px; 
            font-weight: bold; 
        }
        .odd-row:last-child { border-bottom: none; padding-bottom: 0; }
        .odd-value { color: #FFF; font-size: 28px; }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-11%20at%209.23.02%20AM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div class="match-info">
                <div class="team"> 
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">MEX</span>
                </div>
                <div class="score-board">
                    <span id="marcador-local">0</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">0</span>
                </div>
                <div class="team right">
                    <span id="equipo-visita">RSA</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>
                <div class="odd-row">
                    <span id="label-gana-local">GANA MEX</span>
                    <span class="odd-value" id="cuota-local">--</span>
                </div>
                <div class="odd-row">
                    <span id="label-empate">EMPATE</span>
                    <span class="odd-value" id="cuota-empate">--</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA RSA</span>
                    <span class="odd-value" id="cuota-visita">--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // EL ID EXACTO DEL PARTIDO DE MÉXICO VS SUDÁFRICA
        const MEXICO_EVENT_ID = "13177428310"; 
        let actualizacionEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                return data;
            } catch (error) {
                console.error("Error en fetchCodere:", error);
                return null;
            }
        }

        // Formateador de momios (Maneja decimales y formato americano como el diseño visual)
        const formatMomio = (val) => {
            if (val == null || val === "" || val === "-") return "N/D";
            const strVal = val.toString();
            
            if (strVal.includes('.')) {
                const num = Number(val);
                return !isNaN(num) ? num.toFixed(2) : strVal;
            }
            
            const num = Number(val);
            if (isNaN(num)) return val;
            return num > 0 ? `+${num}` : num.toString();
        };

        function procesarDataDelPartido(arrayEventos) {
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) return null;
            
            let dataPartido = {
                marcadorLocal: 0,
                marcadorVisita: 0,
                cuotaL: "N/D",
                cuotaE: "N/D",
                cuotaV: "N/D"
            };

            const juegos = [];
            const resultados = [];

            for (let item of arrayEventos) {
                if (!item.Value) continue;
                if (item.Value.Type === "Event" && item.Value.NodeId === MEXICO_EVENT_ID) {
                    dataPartido.marcadorLocal = item.Value.HomeScore != null ? item.Value.HomeScore : 0;
                    dataPartido.marcadorVisita = item.Value.AwayScore != null ? item.Value.AwayScore : 0;
                } else if (item.Value.Type === "Game") {
                    juegos.push(item.Value);
                } else if (item.Value.Type === "Result") {
                    resultados.push(item.Value);
                }
            }

            // Buscar mercado principal de Resultado 1X2
            let mercadoPrincipal = juegos.find(j => j.GameType === 1 || j.GameType === 97 || j.GameType === 159);
            
            if (!mercadoPrincipal) {
                mercadoPrincipal = juegos.find(j => j.NodeName && j.NodeName.toUpperCase().includes("RESULTADO"));
            }

            if (mercadoPrincipal) {
                const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
                
                // Asegurar orden Local, Empate, Visita
                resultadosMercado.sort((a, b) => {
                    let orderA = 99, orderB = 99;
                    try {
                        orderA = parseInt(a.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                        orderB = parseInt(b.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                    } catch(e){}
                    return orderA - orderB;
                });

                if (resultadosMercado.length >= 3) {
                    // Intenta tomar AmericanOdds si existen, de lo contrario toma Odd/Price
                    let cL = resultadosMercado[0].AmericanOdds || resultadosMercado[0].Odd || resultadosMercado[0].Price || "N/D";
                    let cE = resultadosMercado[1].AmericanOdds || resultadosMercado[1].Odd || resultadosMercado[1].Price || "N/D";
                    let cV = resultadosMercado[2].AmericanOdds || resultadosMercado[2].Odd || resultadosMercado[2].Price || "N/D";

                    dataPartido.cuotaL = formatMomio(cL);
                    dataPartido.cuotaE = formatMomio(cE);
                    dataPartido.cuotaV = formatMomio(cV);
                }
            }

            return dataPartido;
        }

        async function actualizarDatosMexico() {
            if (actualizacionEnProgreso) return;
            actualizacionEnProgreso = true;

            try {
                const arrayEventos = await fetchCodere(`/events/${MEXICO_EVENT_ID}`);
                const datos = procesarDataDelPartido(arrayEventos);

                if (datos) {
                    document.getElementById('marcador-local').innerText = datos.marcadorLocal;
                    document.getElementById('marcador-visita').innerText = datos.marcadorVisita;
                    
                    document.getElementById('cuota-local').innerText = datos.cuotaL;
                    document.getElementById('cuota-empate').innerText = datos.cuotaE;
                    document.getElementById('cuota-visita').innerText = datos.cuotaV;
                }
            } catch (error) {
                console.error("Error al actualizar datos: ", error);
            } finally {
                actualizacionEnProgreso = false;
            }
        }

        // Carga inicial y ciclo de 30 segundos
        actualizarDatosMexico();
        setInterval(actualizarDatosMexico, 30000);
    </script>
</body>
</html>
