<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere en Vivo (Debug Estructura)</title>
    <style>
        /* ==========================================
           ESTILOS CSS
           ========================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { position: relative; width: 325px; height: 960px; background-color: #000; overflow: hidden; box-shadow: 0px 0px 20px rgba(0,0,0,0.5); }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        .data-overlay { position: absolute; z-index: 2; top: 59%; left: 50%; transform: translateX(-50%); width: 88%; background-color: rgba(15, 25, 30, 0.95); border-radius: 12px; padding: 15px; color: #FFF; }

        .league-title { text-align: center; font-size: 11px; font-weight: bold; margin-bottom: 15px; letter-spacing: 0.5px; text-transform: uppercase; color: #00E5FF; }

        .match-info { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 12px; }
        .team { display: flex; align-items: center; font-size: 11px; font-weight: bold; text-transform: uppercase; width: 38%; }
        .team.right { justify-content: flex-end; text-align: right; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin: 0 5px; flex-shrink: 0; }
        .dot-local { background-color: #FAFF00; }
        .dot-visita { background-color: #FF0000; }
        .score-board { font-size: 18px; font-weight: bold; display: flex; justify-content: center; width: 24%; color: #00E5FF; }
        .score-board .separator { margin: 0 5px; color: #FFF; }

        .odds-title { text-align: center; font-size: 12px; margin-bottom: 10px; color: #ccc; }
        .odd-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 8px 0; font-size: 11px; font-weight: bold; }
        .odd-row:last-child { border-bottom: none; padding-bottom: 0; }
        .odd-value { color: #FFF; font-size: 12px; }
        .loading { text-align: center; color: #FAFF00; font-size: 12px; margin-bottom: 10px; }
        
        /* Debug visual en pantalla */
        .debug-info {
            background: rgba(255, 0, 0, 0.8);
            color: white;
            font-size: 7px;
            padding: 3px 5px;
            margin-top: 10px;
            border-radius: 3px;
            max-height: 80px;
            overflow-y: auto;
            display: block;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-05%20at%2012.17.23%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div id="estado-carga" class="loading">Iniciando conexión segura...</div>

            <h3 class="league-title" id="titulo-liga">BUSCANDO...</h3>

            <div class="match-info">
                <div class="team">
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">---</span>
                </div>

                <div class="score-board">
                    <span id="marcador-local">0</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">0</span>
                </div>

                <div class="team right">
                    <span id="equipo-visita">---</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>

                <div class="odd-row">
                    <span id="label-gana-local">GANA LOCAL</span>
                    <span class="odd-value" id="cuota-local">0.00</span>
                </div>
                <div class="odd-row">
                    <span id="label-empate">EMPATE</span>
                    <span class="odd-value" id="cuota-empate">0.00</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA VISITA</span>
                    <span class="odd-value" id="cuota-visita">0.00</span>
                </div>
            </div>
            
            <!-- Debug visual -->
            <div class="debug-info" id="debug-info"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN Y VARIABLES GLOBALES
        // ==========================================
        let escaneoEnProgreso = false;
        const DEBUG_MODE = true;
        
        // Función helper para logs
        function debugLog(mensaje, data = null) {
            if (!DEBUG_MODE) return;
            
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${mensaje}`;
            console.log(logMessage, data || '');
            
            // También mostrar en el widget
            const debugElement = document.getElementById('debug-info');
            if (debugElement) {
                debugElement.innerHTML += `<br>${mensaje.substring(0, 100)}`;
                debugElement.scrollTop = debugElement.scrollHeight;
                
                // Limitar el tamaño del debug
                const lines = debugElement.innerHTML.split('<br>');
                if (lines.length > 10) {
                    lines.splice(0, lines.length - 10);
                    debugElement.innerHTML = lines.join('<br>');
                }
            }
        }

        // ==========================================
        // FUNCIÓN PRINCIPAL DE CONEXIÓN A LA API
        // ==========================================
        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                
                const response = await fetch(url);
                
                if (response.status === 204) {
                    return null;
                }
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(`Status: ${response.status}`);
                }
                
                return data;
            } catch (error) {
                console.error("Error en fetchCodere:", error);
                return null;
            }
        }

        // ==========================================
        // FUNCIÓN PARA EXTRAER LIGAS DE PAÍSES
        // ==========================================
        function extraerLigasDePaises(paisesResponse) {
            let ligasReales = [];
            
            if (!Array.isArray(paisesResponse)) {
                return ligasReales;
            }
            
            for (let pais of paisesResponse) {
                const posiblesLigas = pais.Leagues || pais.leagues || pais.Items || [];
                
                if (Array.isArray(posiblesLigas) && posiblesLigas.length > 0) {
                    ligasReales.push(...posiblesLigas);
                } else if (pais.NodeId && pais.Name) {
                    ligasReales.push(pais);
                }
            }
            
            return ligasReales;
        }

        // ==========================================
        // FUNCIÓN MEJORADA PARA PROCESAR CUOTAS
        // ==========================================
        function procesarCuotas(detallesEvento) {
            let cuotaL = "N/D", cuotaE = "N/D", cuotaV = "N/D";
            let textoEmpate = "EMPATE";
            
            if (!detallesEvento) {
                debugLog('⚠️ No se recibieron detalles del evento');
                return { cuotaL, cuotaE, cuotaV, textoEmpate };
            }
            
            // MOSTRAR ESTRUCTURA COMPLETA EN CONSOLA
            debugLog('🔍 ESTRUCTURA COMPLETA DEL EVENTO:');
            console.log('🎯 EVENTO COMPLETO:', JSON.stringify(detallesEvento, null, 2));
            console.log('📋 PROPIEDADES DEL EVENTO:', Object.keys(detallesEvento));
            
            let mercados = null;
            let rutaMercados = '';
            
            // Opción 1: Games
            if (detallesEvento.Games && Array.isArray(detallesEvento.Games) && detallesEvento.Games.length > 0) {
                mercados = detallesEvento.Games;
                rutaMercados = 'Games';
                debugLog(`✅ Encontrado: detallesEvento.Games (${mercados.length} mercados)`);
            }
            // Opción 2: Markets
            else if (detallesEvento.Markets && Array.isArray(detallesEvento.Markets) && detallesEvento.Markets.length > 0) {
                mercados = detallesEvento.Markets;
                rutaMercados = 'Markets';
                debugLog(`✅ Encontrado: detallesEvento.Markets (${mercados.length} mercados)`);
            }
            // Opción 3: GamesList
            else if (detallesEvento.GamesList && Array.isArray(detallesEvento.GamesList) && detallesEvento.GamesList.length > 0) {
                mercados = detallesEvento.GamesList;
                rutaMercados = 'GamesList';
                debugLog(`✅ Encontrado: detallesEvento.GamesList (${mercados.length} mercados)`);
            }
            // Opción 4: EventGames
            else if (detallesEvento.EventGames && Array.isArray(detallesEvento.EventGames) && detallesEvento.EventGames.length > 0) {
                mercados = detallesEvento.EventGames;
                rutaMercados = 'EventGames';
                debugLog(`✅ Encontrado: detallesEvento.EventGames (${mercados.length} mercados)`);
            }
            // Opción 5: Buscar cualquier array en el primer nivel
            else {
                debugLog('🔍 Buscando cualquier array en el evento...');
                for (let key in detallesEvento) {
                    if (detallesEvento.hasOwnProperty(key) && Array.isArray(detallesEvento[key]) && detallesEvento[key].length > 0) {
                        const arr = detallesEvento[key];
                        debugLog(`📦 Encontrado array en: detallesEvento.${key} (${arr.length} elementos)`);
                        if (arr.length > 0) {
                            debugLog(`   Tipo del primer elemento: ${typeof arr[0]}`);
                            debugLog(`   Primer elemento: ${JSON.stringify(arr[0]).substring(0, 300)}`);
                        }
                    }
                }
                
                // Si no encontramos nada, intentar usar el evento mismo si tiene Results
                if (detallesEvento.Results && Array.isArray(detallesEvento.Results)) {
                    mercados = [detallesEvento];
                    rutaMercados = 'Results directos';
                    debugLog('✅ Usando Results del evento directamente');
                }
            }
            
            if (!mercados || mercados.length === 0) {
                debugLog('❌ No se encontraron mercados en ninguna estructura conocida');
                return { cuotaL, cuotaE, cuotaV, textoEmpate };
            }
            
            // Tomar el primer mercado
            const mercadoPrincipal = mercados[0];
            debugLog(`🎮 Mercado principal (${rutaMercados}):`);
            console.log('MERCADO PRINCIPAL:', JSON.stringify(mercadoPrincipal, null, 2));
            console.log('PROPIEDADES DEL MERCADO:', Object.keys(mercadoPrincipal));
            
            // Buscar resultados en el mercado
            let resultados = null;
            
            if (mercadoPrincipal.Results && Array.isArray(mercadoPrincipal.Results)) {
                resultados = mercadoPrincipal.Results;
                debugLog(`✅ Resultados en: mercadoPrincipal.Results (${resultados.length})`);
            } else if (mercadoPrincipal.results && Array.isArray(mercadoPrincipal.results)) {
                resultados = mercadoPrincipal.results;
                debugLog(`✅ Resultados en: mercadoPrincipal.results (${resultados.length})`);
            } else if (mercadoPrincipal.Odds && Array.isArray(mercadoPrincipal.Odds)) {
                resultados = mercadoPrincipal.Odds;
                debugLog(`✅ Resultados en: mercadoPrincipal.Odds (${resultados.length})`);
            } else if (mercadoPrincipal.Selections && Array.isArray(mercadoPrincipal.Selections)) {
                resultados = mercadoPrincipal.Selections;
                debugLog(`✅ Resultados en: mercadoPrincipal.Selections (${resultados.length})`);
            } else {
                // Buscar cualquier array en el mercado
                debugLog('🔍 Buscando arrays en el mercado...');
                for (let key in mercadoPrincipal) {
                    if (mercadoPrincipal.hasOwnProperty(key) && Array.isArray(mercadoPrincipal[key]) && mercadoPrincipal[key].length > 0) {
                        const arr = mercadoPrincipal[key];
                        debugLog(`📦 Encontrado array en mercado.${key} (${arr.length} elementos)`);
                        if (arr.length > 0) {
                            debugLog(`   Primer elemento: ${JSON.stringify(arr[0]).substring(0, 300)}`);
                        }
                        
                        // Si el array contiene objetos con Odds/Price, probablemente son resultados
                        if (arr.length > 0 && (arr[0].Odds !== undefined || arr[0].Price !== undefined || arr[0].odds !== undefined)) {
                            resultados = arr;
                            debugLog(`✅ Usando mercado.${key} como resultados`);
                            break;
                        }
                    }
                }
            }
            
            if (!resultados || resultados.length === 0) {
                debugLog('❌ No se encontraron resultados');
                return { cuotaL, cuotaE, cuotaV, textoEmpate };
            }
            
            debugLog(`📊 Procesando ${resultados.length} resultados`);
            
            // Mostrar estructura de resultados
            resultados.forEach((res, index) => {
                console.log(`RESULTADO ${index}:`, JSON.stringify(res, null, 2));
                debugLog(`   Resultado ${index}: ${JSON.stringify(res).substring(0, 150)}`);
            });
            
            // Procesar resultados según cantidad
            if (resultados.length === 2) {
                // Deportes sin empate
                const valor1 = resultados[0].Odds || resultados[0].Price || resultados[0].odds || resultados[0].Value || "N/D";
                const valor2 = resultados[1].Odds || resultados[1].Price || resultados[1].odds || resultados[1].Value || "N/D";
                
                cuotaL = typeof valor1 === 'number' ? valor1.toFixed(2) : valor1;
                cuotaV = typeof valor2 === 'number' ? valor2.toFixed(2) : valor2;
                textoEmpate = "N/A";
                cuotaE = "-";
                debugLog('🎾 Deporte sin empate (2 resultados)');
            } else if (resultados.length >= 3) {
                // Deportes con empate
                const valor1 = resultados[0].Odds || resultados[0].Price || resultados[0].odds || resultados[0].Value || "N/D";
                const valor2 = resultados[1].Odds || resultados[1].Price || resultados[1].odds || resultados[1].Value || "N/D";
                const valor3 = resultados[2].Odds || resultados[2].Price || resultados[2].odds || resultados[2].Value || "N/D";
                
                cuotaL = typeof valor1 === 'number' ? valor1.toFixed(2) : valor1;
                cuotaE = typeof valor2 === 'number' ? valor2.toFixed(2) : valor2;
                cuotaV = typeof valor3 === 'number' ? valor3.toFixed(2) : valor3;
                debugLog('⚽ Deporte con empate (3+ resultados)');
            }
            
            debugLog(`💰 Cuotas finales: L=${cuotaL} E=${cuotaE} V=${cuotaV}`);
            
            return { cuotaL, cuotaE, cuotaV, textoEmpate };
        }

        // ==========================================
        // FUNCIÓN PRINCIPAL DE ACTUALIZACIÓN
        // ==========================================
        async function actualizarDatosSolos() {
            if (escaneoEnProgreso) {
                debugLog('⏳ Escaneo ya en progreso, omitiendo...');
                return;
            }
            
            escaneoEnProgreso = true;
            const estadoCarga = document.getElementById('estado-carga');
            const debugElement = document.getElementById('debug-info');
            
            // Limpiar debug visual
            if (debugElement) {
                debugElement.innerHTML = '';
            }

            try {
                estadoCarga.style.display = 'block';
                estadoCarga.innerText = "🔍 Buscando deportes...";
                debugLog('🚀 INICIANDO BÚSQUEDA DE EVENTOS EN VIVO');

                // 1. Obtener lista de deportes
                const deportes = await fetchCodere('/sports');
                if (!deportes || !Array.isArray(deportes)) {
                    throw new Error("No se pudieron obtener los deportes");
                }
                
                debugLog(`🏆 Deportes totales: ${deportes.length}`);
                
                // 2. Filtrar deportes relevantes
                const deportesTop = ["Fútbol", "Soccer", "Tenis", "Baloncesto", "Esports", "Tenis de Mesa", "Béisbol"];
                const deportesActivos = deportes.filter(d => deportesTop.includes(d.Name));
                
                debugLog(`🎯 Deportes activos: ${deportesActivos.length}`);

                let eventoEnVivo = null;
                let ligaConEvento = null;
                let deporteDelEvento = null;

                // 3. Buscar eventos en cada deporte
                for (let deporte of deportesActivos) {
                    estadoCarga.innerText = `📡 ${deporte.Name}...`;
                    debugLog(`🔍 ${deporte.Name}...`);
                    
                    const paisesResponse = await fetchCodere(`/sports/${deporte.NodeId}/leagues`);
                    if (!paisesResponse) continue;
                    
                    const ligasReales = extraerLigasDePaises(paisesResponse);
                    
                    if (ligasReales.length === 0) {
                        debugLog(`📭 Sin ligas para ${deporte.Name}`);
                        continue;
                    }
                    
                    // Priorizar ligas relevantes
                    const palabrasClave = ["AMISTOSOS", "INTERNACIONAL", "ESPORTS", "MESA", "LIGA MX", "PRO", "PREMIER"];
                    ligasReales.sort((a, b) => {
                        const nombreA = (a.Name || '').toUpperCase();
                        const nombreB = (b.Name || '').toUpperCase();
                        const prioA = palabrasClave.some(k => nombreA.includes(k)) ? 1 : 0;
                        const prioB = palabrasClave.some(k => nombreB.includes(k)) ? 1 : 0;
                        return prioB - prioA;
                    });
                    
                    const ligasARevisar = ligasReales.slice(0, 10);
                    
                    for (let liga of ligasARevisar) {
                        if (!liga.NodeId) continue;
                        
                        estadoCarga.innerText = `🎮 ${liga.Name?.substring(0, 20)}...`;
                        
                        const eventos = await fetchCodere(`/leagues/${liga.NodeId}/liveEvents`);
                        
                        if (eventos && Array.isArray(eventos) && eventos.length > 0) {
                            debugLog(`🎉 ¡${eventos.length} eventos en ${liga.Name}!`);
                            eventoEnVivo = eventos[0];
                            ligaConEvento = liga;
                            deporteDelEvento = deporte;
                            break;
                        }
                    }
                    
                    if (eventoEnVivo) break;
                }

                // 4. Si no hay eventos, mostrar estado vacío
                if (!eventoEnVivo) {
                    debugLog('📭 No se encontraron eventos en vivo');
                    mostrarEstadoVacio();
                    estadoCarga.style.display = 'none';
                    escaneoEnProgreso = false;
                    return;
                }

                // 5. Procesar el evento encontrado
                debugLog(`🎯 Evento: ${eventoEnVivo.Name}`);
                
                const equipos = eventoEnVivo.Name ? eventoEnVivo.Name.split(" - ") : ["LOCAL", "VISITA"];
                const nombreLocal = equipos[0] ? equipos[0].substring(0, 15).trim() : "LOCAL";
                const nombreVisita = equipos[1] ? equipos[1].substring(0, 15).trim() : "VISITA";
                
                // 6. Obtener detalles completos del evento
                estadoCarga.innerText = "💰 Cargando cuotas...";
                const detallesEvento = await fetchCodere(`/events/${eventoEnVivo.NodeId}`);
                
                // Procesar cuotas
                const cuotas = procesarCuotas(detallesEvento);

                // 7. Actualizar la interfaz
                actualizarInterfaz({
                    deporte: deporteDelEvento,
                    liga: ligaConEvento,
                    evento: eventoEnVivo,
                    nombreLocal,
                    nombreVisita,
                    cuotas
                });
                
                estadoCarga.style.display = 'none';
                debugLog('✅ ¡ACTUALIZACIÓN COMPLETADA!');

            } catch (error) {
                debugLog('💥 ERROR CRÍTICO');
                estadoCarga.innerText = "❌ Error de conexión";
                console.error("Error:", error);
            } finally {
                escaneoEnProgreso = false;
            }
        }

        // ==========================================
        // FUNCIÓN PARA MOSTRAR ESTADO VACÍO
        // ==========================================
        function mostrarEstadoVacio() {
            document.getElementById('titulo-liga').innerText = 'RADAR GLOBAL - SIN EVENTOS';
            document.getElementById('equipo-local').innerText = 'CODERE';
            document.getElementById('equipo-visita').innerText = 'DEPORTES';
            document.getElementById('marcador-local').innerText = '-';
            document.getElementById('marcador-visita').innerText = '-';
            document.getElementById('label-gana-local').innerText = 'GANA LOCAL';
            document.getElementById('label-gana-visita').innerText = 'GANA VISITA';
            document.getElementById('label-empate').innerText = 'EMPATE';
            document.getElementById('cuota-local').innerText = '0.00';
            document.getElementById('cuota-empate').innerText = '0.00';
            document.getElementById('cuota-visita').innerText = '0.00';
        }

        // ==========================================
        // FUNCIÓN PARA ACTUALIZAR LA INTERFAZ
        // ==========================================
        function actualizarInterfaz(datos) {
            const { deporte, liga, evento, nombreLocal, nombreVisita, cuotas } = datos;
            
            document.getElementById('titulo-liga').innerText = 
                `${deporte.Name} - ${liga.Name.substring(0, 20)}`;
            
            document.getElementById('equipo-local').innerText = nombreLocal.toUpperCase();
            document.getElementById('equipo-visita').innerText = nombreVisita.toUpperCase();
            
            document.getElementById('marcador-local').innerText = 
                evento.HomeScore !== null && evento.HomeScore !== undefined ? evento.HomeScore : '0';
            document.getElementById('marcador-visita').innerText = 
                evento.AwayScore !== null && evento.AwayScore !== undefined ? evento.AwayScore : '0';
            
            document.getElementById('label-gana-local').innerText = `GANA ${nombreLocal.toUpperCase()}`;
            document.getElementById('label-gana-visita').innerText = `GANA ${nombreVisita.toUpperCase()}`;
            document.getElementById('label-empate').innerText = cuotas.textoEmpate;
            
            document.getElementById('cuota-local').innerText = cuotas.cuotaL;
            document.getElementById('cuota-empate').innerText = cuotas.cuotaE;
            document.getElementById('cuota-visita').innerText = cuotas.cuotaV;
        }

        // ==========================================
        // INICIAR EL SISTEMA
        // ==========================================
        debugLog('🟢 SISTEMA INICIADO - MODO DEBUG');
        actualizarDatosSolos();
        
        // Actualizar cada 30 segundos
        setInterval(actualizarDatosSolos, 30000);
    </script>
</body>
</html>
