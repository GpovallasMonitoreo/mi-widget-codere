<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere en Vivo - Doble Partido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { position: relative; width: 325px; height: 960px; background-color: #000; overflow: hidden; box-shadow: 0px 0px 20px rgba(0,0,0,0.5); }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        .data-overlay { position: absolute; z-index: 2; top: 59%; left: 50%; transform: translateX(-50%); width: 88%; background-color: rgba(15, 25, 30, 0.95); border-radius: 12px; padding: 15px; color: #FFF; }

        .league-title { text-align: center; font-size: 11px; font-weight: bold; margin-bottom: 15px; letter-spacing: 0.5px; text-transform: uppercase; color: #00E5FF; }

        /* Contenedor de partidos */
        .partidos-container { display: flex; flex-direction: column; gap: 15px; }

        /* Cada partido */
        .partido { border-bottom: 1px solid #333; padding-bottom: 12px; }
        .partido:last-child { border-bottom: none; padding-bottom: 0; }

        /* Marcador en formato 2-1 */
        .marcador-principal { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #FFF; }
        .equipos-nombre { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 10px; text-transform: uppercase; }
        .equipo-local-nombre { color: #FAFF00; text-align: left; width: 40%; }
        .equipo-visita-nombre { color: #FF0000; text-align: right; width: 40%; }
        .marcador-score { text-align: center; font-size: 18px; font-weight: bold; color: #00E5FF; width: 20%; }

        /* Cuotas */
        .cuotas-container { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; }
        .cuota-item { text-align: center; flex: 1; }
        .cuota-label { color: #CCC; font-size: 8px; margin-bottom: 3px; }
        .cuota-valor { color: #FFF; font-size: 12px; font-weight: bold; }

        .loading { text-align: center; color: #FAFF00; font-size: 12px; margin-bottom: 10px; }
        .separador-partidos { border-top: 1px dashed #444; margin: 8px 0; }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-05%20at%2012.17.23%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div id="estado-carga" class="loading">Iniciando conexión segura...</div>

            <h3 class="league-title" id="titulo-liga">BUSCANDO...</h3>

            <div class="partidos-container" id="partidos-container">
                <!-- Los partidos se generan dinámicamente aquí -->
            </div>
        </div>
    </div>

    <script>
        let escaneoEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                
                if (response.status === 204) return null;
                
                const data = await response.json();
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                
                return data;
            } catch (error) {
                console.error("Error en fetchCodere:", error);
                return null;
            }
        }

        function extraerLigasDePaises(paisesResponse) {
            let ligasReales = [];
            
            if (!Array.isArray(paisesResponse)) return ligasReales;
            
            for (let pais of paisesResponse) {
                const posiblesLigas = pais.Leagues || pais.leagues || pais.Items || [];
                
                if (Array.isArray(posiblesLigas) && posiblesLigas.length > 0) {
                    ligasReales.push(...posiblesLigas);
                } else if (pais.NodeId && pais.Name) {
                    ligasReales.push(pais);
                }
            }
            
            return ligasReales;
        }

        function procesarArrayEventos(arrayEventos) {
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) {
                return { cuotaL: "N/D", cuotaE: "N/D", cuotaV: "N/D", textoEmpate: "EMPATE", esConEmpate: false };
            }
            
            const juegos = [];
            const resultados = [];
            
            for (let item of arrayEventos) {
                if (!item.Value) continue;
                
                const value = item.Value;
                
                if (value.Type === "Game") {
                    juegos.push(value);
                } else if (value.Type === "Result") {
                    resultados.push(value);
                }
            }
            
            // Priorizar GameType 1 (Resultado Final - Fútbol), 97 (Ganador del Partido - Baloncesto)
            let mercadoPrincipal = juegos.find(j => j.GameType === 1) ||
                                  juegos.find(j => j.GameType === 97) ||
                                  juegos.find(j => j.GameType === 159) ||
                                  juegos[0];
            
            if (!mercadoPrincipal) {
                return { cuotaL: "N/D", cuotaE: "N/D", cuotaV: "N/D", textoEmpate: "EMPATE", esConEmpate: false };
            }
            
            const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
            
            if (resultadosMercado.length === 0) {
                return { cuotaL: "N/D", cuotaE: "N/D", cuotaV: "N/D", textoEmpate: "EMPATE", esConEmpate: false };
            }
            
            let cuotaL = "N/D", cuotaE = "N/D", cuotaV = "N/D";
            let textoEmpate = "EMPATE";
            let esConEmpate = false;
            
            if (resultadosMercado.length === 2) {
                cuotaL = resultadosMercado[0].Odd || resultadosMercado[0].Odds || resultadosMercado[0].Price || "N/D";
                cuotaV = resultadosMercado[1].Odd || resultadosMercado[1].Odds || resultadosMercado[1].Price || "N/D";
                textoEmpate = "N/A";
                cuotaE = "-";
                esConEmpate = false;
            } else if (resultadosMercado.length >= 3) {
                cuotaL = resultadosMercado[0].Odd || resultadosMercado[0].Odds || resultadosMercado[0].Price || "N/D";
                cuotaE = resultadosMercado[1].Odd || resultadosMercado[1].Odds || resultadosMercado[1].Price || "N/D";
                cuotaV = resultadosMercado[2].Odd || resultadosMercado[2].Odds || resultadosMercado[2].Price || "N/D";
                esConEmpate = true;
            }
            
            if (typeof cuotaL === 'number') cuotaL = cuotaL.toFixed(2);
            if (typeof cuotaE === 'number') cuotaE = cuotaE.toFixed(2);
            if (typeof cuotaV === 'number') cuotaV = cuotaV.toFixed(2);
            
            return { cuotaL, cuotaE, cuotaV, textoEmpate, esConEmpate };
        }

        function crearHTMLPartido(evento, cuotas, nombreLocal, nombreVisita) {
            const marcadorLocal = evento.HomeScore != null ? evento.HomeScore : "0";
            const marcadorVisita = evento.AwayScore != null ? evento.AwayScore : "0";
            
            let htmlCuotas = '';
            
            if (cuotas.esConEmpate) {
                // Fútbol - 3 cuotas: Local, Empate, Visita
                htmlCuotas = `
                    <div class="cuotas-container">
                        <div class="cuota-item">
                            <div class="cuota-label">GANA ${nombreLocal}</div>
                            <div class="cuota-valor">${cuotas.cuotaL}</div>
                        </div>
                        <div class="cuota-item">
                            <div class="cuota-label">EMPATE</div>
                            <div class="cuota-valor">${cuotas.cuotaE}</div>
                        </div>
                        <div class="cuota-item">
                            <div class="cuota-label">GANA ${nombreVisita}</div>
                            <div class="cuota-valor">${cuotas.cuotaV}</div>
                        </div>
                    </div>
                `;
            } else {
                // Baloncesto, Tenis - 2 cuotas: Local, Visita
                htmlCuotas = `
                    <div class="cuotas-container">
                        <div class="cuota-item">
                            <div class="cuota-label">GANA ${nombreLocal}</div>
                            <div class="cuota-valor">${cuotas.cuotaL}</div>
                        </div>
                        <div class="cuota-item">
                            <div class="cuota-label">GANA ${nombreVisita}</div>
                            <div class="cuota-valor">${cuotas.cuotaV}</div>
                        </div>
                    </div>
                `;
            }
            
            return `
                <div class="partido">
                    <div class="marcador-principal">${nombreLocal} ${marcadorLocal}-${marcadorVisita} ${nombreVisita}</div>
                    ${htmlCuotas}
                </div>
            `;
        }

        async function actualizarDatosSolos() {
            if (escaneoEnProgreso) return;
            
            escaneoEnProgreso = true;
            const estadoCarga = document.getElementById('estado-carga');
            const container = document.getElementById('partidos-container');

            try {
                estadoCarga.style.display = 'block';
                estadoCarga.innerText = "Buscando partidos...";

                const deportes = await fetchCodere('/sports');
                if (!deportes || !Array.isArray(deportes)) throw new Error("No se pudieron obtener los deportes");

                const deportesTop = ["Fútbol", "Soccer", "Tenis", "Baloncesto", "Esports", "Tenis de Mesa", "Béisbol"];
                const deportesActivos = deportes.filter(d => deportesTop.includes(d.Name));

                let eventosEncontrados = [];
                let deporteSeleccionado = null;
                let ligaSeleccionada = null;

                // Buscar eventos en vivo
                for (let deporte of deportesActivos) {
                    if (eventosEncontrados.length >= 2) break;
                    
                    estadoCarga.innerText = `Cargando ${deporte.Name}...`;
                    
                    const paisesResponse = await fetchCodere(`/sports/${deporte.NodeId}/leagues`);
                    if (!paisesResponse) continue;
                    
                    const ligasReales = extraerLigasDePaises(paisesResponse);
                    if (ligasReales.length === 0) continue;
                    
                    const palabrasClave = ["LIGA MX", "PREMIER", "AMISTOSOS", "INTERNACIONAL", "NBA", "WNBA", "PRO"];
                    ligasReales.sort((a, b) => {
                        const nombreA = (a.Name || '').toUpperCase();
                        const nombreB = (b.Name || '').toUpperCase();
                        const prioA = palabrasClave.some(k => nombreA.includes(k)) ? 1 : 0;
                        const prioB = palabrasClave.some(k => nombreB.includes(k)) ? 1 : 0;
                        return prioB - prioA;
                    });
                    
                    const ligasARevisar = ligasReales.slice(0, 10);
                    
                    for (let liga of ligasARevisar) {
                        if (eventosEncontrados.length >= 2) break;
                        if (!liga.NodeId) continue;
                        
                        estadoCarga.innerText = `Revisando: ${liga.Name?.substring(0, 15)}...`;
                        
                        const eventos = await fetchCodere(`/leagues/${liga.NodeId}/liveEvents`);
                        
                        if (eventos && Array.isArray(eventos) && eventos.length > 0) {
                            // Tomar hasta 2 eventos de esta liga
                            const eventosTomar = eventos.slice(0, 2 - eventosEncontrados.length);
                            
                            for (let evento of eventosTomar) {
                                const arrayEventos = await fetchCodere(`/events/${evento.NodeId}`);
                                const cuotas = procesarArrayEventos(arrayEventos);
                                
                                const equipos = evento.Name ? evento.Name.split(" - ") : ["LOCAL", "VISITA"];
                                const nombreLocal = equipos[0] ? equipos[0].substring(0, 15).trim() : "LOCAL";
                                const nombreVisita = equipos[1] ? equipos[1].substring(0, 15).trim() : "VISITA";
                                
                                eventosEncontrados.push({
                                    evento,
                                    cuotas,
                                    nombreLocal,
                                    nombreVisita
                                });
                                
                                if (!deporteSeleccionado) deporteSeleccionado = deporte;
                                if (!ligaSeleccionada) ligaSeleccionada = liga;
                                
                                if (eventosEncontrados.length >= 2) break;
                            }
                        }
                    }
                }

                if (eventosEncontrados.length === 0) {
                    container.innerHTML = '<div style="text-align:center;color:#CCC;font-size:12px;">SIN EVENTOS EN VIVO</div>';
                    document.getElementById('titulo-liga').innerText = 'RADAR GLOBAL - SIN EVENTOS';
                    estadoCarga.style.display = 'none';
                    escaneoEnProgreso = false;
                    return;
                }

                // Actualizar título de liga
                if (ligaSeleccionada && deporteSeleccionado) {
                    document.getElementById('titulo-liga').innerText = 
                        `${deporteSeleccionado.Name} - ${ligaSeleccionada.Name.substring(0, 20)}`;
                }

                // Generar HTML de los partidos
                let htmlPartidos = '';
                eventosEncontrados.forEach((item, index) => {
                    if (index > 0) {
                        htmlPartidos += '<div class="separador-partidos"></div>';
                    }
                    htmlPartidos += crearHTMLPartido(item.evento, item.cuotas, item.nombreLocal, item.nombreVisita);
                });
                
                container.innerHTML = htmlPartidos;
                estadoCarga.style.display = 'none';

            } catch (error) {
                console.error("Error en renderizado: ", error);
                estadoCarga.innerText = "Error de conexión";
                container.innerHTML = '<div style="text-align:center;color:#F00;font-size:12px;">ERROR DE CONEXIÓN</div>';
            } finally {
                escaneoEnProgreso = false;
            }
        }

        actualizarDatosSolos();
        setInterval(actualizarDatosSolos, 30000);
    </script>
</body>
</html>
