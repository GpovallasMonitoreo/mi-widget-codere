<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere - MEX vs RSA En Vivo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { position: relative; width: 325px; height: 960px; background-color: #000; overflow: hidden; box-shadow: 0px 0px 20px rgba(0,0,0,0.5); }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 58%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 88%; 
            background-color: #171f24; 
            border-radius: 8px; 
            padding: 15px 20px; 
            color: #FFF; 
        }

        .match-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #7bc100; 
            padding-bottom: 12px; 
            margin-bottom: 15px; 
        }
        
        .team { display: flex; align-items: center; font-size: 18px; font-weight: bold; text-transform: uppercase; width: 40%; }
        .team.right { justify-content: flex-end; text-align: right; }
        
        .dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 8px; flex-shrink: 0; }
        .dot-local { background-color: #009900; } 
        .dot-visita { background-color: #FFD700; } 
        
        .score-board { font-size: 32px; font-weight: bold; display: flex; justify-content: center; width: 20%; color: #FFF; }
        .score-board .separator { margin: 0 6px; color: #FFF; }

        .odds-section { display: flex; flex-direction: column; }
        .odds-title { text-align: center; font-size: 14px; margin-bottom: 12px; color: #FFF; font-weight: bold; text-transform: uppercase; }
        
        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid #7bc100; 
            padding: 8px 0; 
            font-size: 16px; 
            font-weight: bold; 
        }
        .odd-row:last-child { border-bottom: none; padding-bottom: 0; }
        .odd-value { color: #FFF; font-size: 20px; }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-09%20at%208.40.30%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div class="match-info">
                <div class="team">
                    <span class="dot dot-local"></span>
                    <span id="equipo-local">MEX</span>
                </div>
                <div class="score-board">
                    <span id="marcador-local">-</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">-</span>
                </div>
                <div class="team right">
                    <span id="equipo-visita">RSA</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <div class="odds-section">
                <h4 class="odds-title">OPCIONES DE APUESTA</h4>
                <div class="odd-row">
                    <span id="label-gana-local">GANA MEX</span>
                    <span class="odd-value" id="cuota-local">-</span>
                </div>
                <div class="odd-row">
                    <span id="label-empate">EMPATE</span>
                    <span class="odd-value" id="cuota-empate">-</span>
                </div>
                <div class="odd-row">
                    <span id="label-gana-visita">GANA RSA</span>
                    <span class="odd-value" id="cuota-visita">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let escaneoEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) return null; 
                return data;
            } catch (error) {
                return null; 
            }
        }

        // Formatea el número para forzar el "+" en momios positivos americanos (ej. +330)
        const formatMomio = (val) => {
            if (val == null || val === "") return "-";
            const num = Number(val);
            if (isNaN(num)) return val; 
            return num > 0 ? `+${num}` : num.toString();
        };

        async function actualizarDatosSolos() {
            if (escaneoEnProgreso) return;
            escaneoEnProgreso = true;

            try {
                // 1. Obtener Deporte (Fútbol)
                const sports = await fetchCodere('/getSportsMexico');
                if (!sports || !Array.isArray(sports)) throw new Error("Sin datos de deportes");
                const futbol = sports.find(s => s.Name === "Fútbol" || s.Code === "SOCCER") || sports[0];
                const sportCode = futbol.Code || futbol.sport_code || futbol.Id;

                // 2. Obtener Clase (Buscando el Mundial 2026)
                const classes = await fetchCodere(`/getClassesForSport/${sportCode}`);
                if (!classes || !Array.isArray(classes)) throw new Error("Sin datos de clases");
                const claseMundial = classes.find(c => c.Name && c.Name.includes("Mundial 2026")) || classes[0];
                const classId = claseMundial.sb_class_id || claseMundial.Id;

                // 3. Obtener Tipo (Partidos)
                const types = await fetchCodere(`/getTypesForClass/${classId}`);
                if (!types || !Array.isArray(types)) throw new Error("Sin datos de tipos");
                const tipoPartidos = types.find(t => t.Name && t.Name.includes("Partidos")) || types[0];
                const typeId = tipoPartidos.sb_type_id || tipoPartidos.Id;

                // 4. Obtener Evento (México v Sudáfrica)
                const events = await fetchCodere(`/getEventsForType/${typeId}`);
                if (!events || !Array.isArray(events)) throw new Error("Sin eventos");
                
                const eventoMexico = events.find(ev => ev.Name && (ev.Name.toUpperCase().includes("MÉXICO") || ev.Name.toUpperCase().includes("MEX")));
                
                if (!eventoMexico) {
                    escaneoEnProgreso = false;
                    return; // Retiene los guiones neutros en el widget si el evento no está expuesto aún
                }

                const evId = eventoMexico.ev_id || eventoMexico.Id;

                // 5. Obtener Mercados del Evento
                const markets = await fetchCodere(`/getMarketsByEvent/${evId}`);
                if (!markets || !Array.isArray(markets)) throw new Error("Sin mercados");
                
                // Buscamos "1X2 - Momios Mejorados" como se ve en tu imagen
                const mercado1x2 = markets.find(m => m.Name && (m.Name.includes("1X2") || m.Name.includes("Ganador"))) || markets[0];
                const resultados = mercado1x2.Selections || mercado1x2.Results || mercado1x2.Items || [];

                // 6. Inyectar datos en la pantalla
                if (resultados.length >= 3) {
                    // Soporte dinámico para el nombre de la propiedad (Odd, AmericanOdds o Price)
                    const getOdd = (res) => res.Odd || res.AmericanOdds || res.Price || "-";

                    document.getElementById('cuota-local').innerText = formatMomio(getOdd(resultados[0]));
                    document.getElementById('cuota-empate').innerText = formatMomio(getOdd(resultados[1]));
                    document.getElementById('cuota-visita').innerText = formatMomio(getOdd(resultados[2]));
                }

                // Asegurar marcador inicial en 0 al ser pre-partido
                document.getElementById('marcador-local').innerText = "0";
                document.getElementById('marcador-visita').innerText = "0";

            } catch (error) {
                // Falla silenciosa para evitar parpadeos extraños en la vista de producción
            } finally {
                escaneoEnProgreso = false;
            }
        }

        actualizarDatosSolos();
        setInterval(actualizarDatosSolos, 30000); // Refresco cada 30 segundos
    </script>
</body>
</html>
