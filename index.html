<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere Broadsign - Finalizado Tamaño Grande</title>
    <style>
        /* 1. EL FONDO: Forzado al 100% exacto del frame de Broadsign */
        html, body {
            margin: 0; 
            padding: 0;
            width: 100vw; 
            height: 100vh;
            background-color: #0d1418;
            background-image: url('https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-09%20at%208.40.30%20PM.jpeg');
            background-size: 100% 100%; 
            background-repeat: no-repeat; 
            background-position: center; 
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
        }

        /* 2. EL MODAL: Más ancho y con más espacio interior */
        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 65vh; 
            transform: translateY(-50%); 
            width: 90vw; /* Aumentado a 90% del ancho */
            max-width: 400px; /* Aumentado de 320px a 400px para que se vea imponente */
            background-color: #1a2024; 
            border-radius: 8px; 
            padding: 6vw 4vw; /* Más margen interior para darle altura */
            color: #FFF; 
            box-shadow: 0px 10px 25px rgba(0,0,0,0.8);
            transition: all 0.3s ease-in-out; 
        }

        /* Sección del Marcador */
        .match-info { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 2vw; 
            border-bottom: 2px solid #3d4a22; 
            padding-bottom: 3vw; 
            margin-bottom: 3vw; 
        }
        
        .team-container { 
            display: flex; 
            align-items: center; 
            gap: 2vw; 
        }
        
        /* Fuentes más grandes */
        .team-name { 
            font-size: clamp(16px, 5.5vw, 24px); /* Textos más grandes */
            font-weight: 900; 
            letter-spacing: 0.5px;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .dot-local { background-color: #00C800; } 
        .dot-visita { background-color: #FFD700; } 

        .score-board { 
            font-size: clamp(32px, 10vw, 48px); /* Marcador mucho más grande */
            font-weight: 900; 
            display: flex; 
            align-items: center;
        }
        .score-board .separator { margin: 0 1.5vw; }

        /* Sección de Momios */
        .odds-title { 
            text-align: center; 
            font-size: clamp(9px, 3.5vw, 12px); 
            font-weight: 800;
            margin-bottom: 3vw; 
            letter-spacing: 0.5px; 
        }

        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #3d4a22; 
            padding: 2.5vw 0; 
        }
        
        .odd-row:last-child { 
            border-bottom: none; 
            padding-bottom: 0; 
        }

        .odd-label { 
            font-size: clamp(11px, 4vw, 15px); 
            font-weight: bold; 
        }
        
        .odd-value { 
            font-size: clamp(12px, 4.2vw, 16px); 
            font-weight: 900; 
        }
    </style>
</head>
<body>

    <div class="data-overlay" id="widget-datos">
        <div class="match-info" id="contenedor-marcador">
            <div class="team-container">
                <span class="dot dot-local"></span>
                <span class="team-name">MEX</span>
            </div>
            <div class="score-board">
                <span id="marcador-local">0</span>
                <span class="separator">-</span>
                <span id="marcador-visita">0</span>
            </div>
            <div class="team-container">
                <span class="team-name">RSA</span>
                <span class="dot dot-visita"></span>
            </div>
        </div>

        <h4 class="odds-title" id="titulo-seccion">OPCIONES DE APUESTA</h4>
        
        <div class="odds-section" id="seccion-momios">
            <div class="odd-row">
                <span class="odd-label">GANA MEX</span>
                <span class="odd-value" id="cuota-local">--</span>
            </div>
            <div class="odd-row">
                <span class="odd-label">EMPATE</span>
                <span class="odd-value" id="cuota-empate">--</span>
            </div>
            <div class="odd-row">
                <span class="odd-label">GANA RSA</span>
                <span class="odd-value" id="cuota-visita">--</span>
            </div>
        </div>
    </div>

    <script>
        const MEXICO_EVENT_ID = "13177428310"; 
        let actualizacionEnProgreso = false;
        let intervaloActualizacion;

        // ==========================================
        // MARCADOR FINAL DE RESPALDO (2 - 0)
        // ==========================================
        const MARCADOR_FINAL_MEX = 2; 
        const MARCADOR_FINAL_RSA = 0; 
        // ==========================================

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                
                // Si la API arroja 404 el partido terminó
                if (response.status === 404) return "TERMINADO"; 
                if (response.status === 204) return null;
                
                const data = await response.json();
                if (!response.ok) return null;
                
                return data;
            } catch (error) {
                return null;
            }
        }

        const formatMomio = (val) => {
            if (val == null || val === "" || val === "-") return "N/D";
            const strVal = val.toString();
            if (strVal.includes('.')) {
                const num = Number(val);
                return !isNaN(num) ? num.toFixed(2) : strVal;
            }
            const num = Number(val);
            if (isNaN(num)) return val;
            return num > 0 ? `+${num}` : num.toString();
        };

        function procesarDataDelPartido(arrayEventos) {
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) return null;
            
            let dataPartido = { marcadorLocal: 0, marcadorVisita: 0, cuotaL: "N/D", cuotaE: "N/D", cuotaV: "N/D" };
            const juegos = [];
            const resultados = [];

            for (let item of arrayEventos) {
                if (!item.Value) continue;
                if (item.Value.Type === "Event" && item.Value.NodeId === MEXICO_EVENT_ID) {
                    dataPartido.marcadorLocal = item.Value.HomeScore != null ? item.Value.HomeScore : 0;
                    dataPartido.marcadorVisita = item.Value.AwayScore != null ? item.Value.AwayScore : 0;
                } else if (item.Value.Type === "Game") {
                    juegos.push(item.Value);
                } else if (item.Value.Type === "Result") {
                    resultados.push(item.Value);
                }
            }

            let mercadoPrincipal = juegos.find(j => j.GameType === 1 || j.GameType === 97 || j.GameType === 159) || 
                                   juegos.find(j => j.NodeName && j.NodeName.toUpperCase().includes("RESULTADO"));

            if (mercadoPrincipal) {
                const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
                
                resultadosMercado.sort((a, b) => {
                    let orderA = 99, orderB = 99;
                    try {
                        orderA = parseInt(a.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                        orderB = parseInt(b.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                    } catch(e){}
                    return orderA - orderB;
                });

                if (resultadosMercado.length >= 3) {
                    let cL = resultadosMercado[0].AmericanOdds || resultadosMercado[0].Odd || resultadosMercado[0].Price || "N/D";
                    let cE = resultadosMercado[1].AmericanOdds || resultadosMercado[1].Odd || resultadosMercado[1].Price || "N/D";
                    let cV = resultadosMercado[2].AmericanOdds || resultadosMercado[2].Odd || resultadosMercado[2].Price || "N/D";

                    dataPartido.cuotaL = formatMomio(cL);
                    dataPartido.cuotaE = formatMomio(cE);
                    dataPartido.cuotaV = formatMomio(cV);
                }
            }
            return dataPartido;
        }

        function mostrarMarcadorFinal() {
            document.getElementById('marcador-local').innerText = MARCADOR_FINAL_MEX;
            document.getElementById('marcador-visita').innerText = MARCADOR_FINAL_RSA;
            
            document.getElementById('contenedor-marcador').style.borderBottom = "none";
            document.getElementById('contenedor-marcador').style.marginBottom = "0";
            document.getElementById('contenedor-marcador').style.paddingBottom = "0";
            
            document.getElementById('seccion-momios').style.display = 'none';
            
            const titulo = document.getElementById('titulo-seccion');
            titulo.innerText = "PARTIDO FINALIZADO";
            titulo.style.color = "#00C800"; 
            titulo.style.marginTop = "25px"; // Le da aire hacia arriba para que la caja se vea alta
            titulo.style.marginBottom = "10px"; // Le da aire hacia abajo
            titulo.style.fontSize = "clamp(12px, 4.5vw, 16px)"; // Texto final un poco más grande
        }

        async function actualizarDatosMexico() {
            if (actualizacionEnProgreso) return;
            actualizacionEnProgreso = true;

            try {
                const respuestaApi = await fetchCodere(`/events/${MEXICO_EVENT_ID}`);
                
                // Ya detecta el 404 del log y dispara la vista final grande
                if (respuestaApi === "TERMINADO") {
                    mostrarMarcadorFinal();
                    clearInterval(intervaloActualizacion); 
                    return;
                }

                const datos = procesarDataDelPartido(respuestaApi);

                if (datos) {
                    document.getElementById('marcador-local').innerText = datos.marcadorLocal;
                    document.getElementById('marcador-visita').innerText = datos.marcadorVisita;
                    document.getElementById('cuota-local').innerText = datos.cuotaL;
                    document.getElementById('cuota-empate').innerText = datos.cuotaE;
                    document.getElementById('cuota-visita').innerText = datos.cuotaV;
                }
            } catch (error) {
                console.error("Error al actualizar datos: ", error);
            } finally {
                actualizacionEnProgreso = false;
            }
        }

        // Carga inicial y ciclo
        actualizarDatosMexico();
        intervaloActualizacion = setInterval(actualizarDatosMexico, 30000);
    </script>
</body>
</html>
