<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🇲🇽 México vs Sudáfrica | Mundial 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .pantalla-display {
            position: relative;
            width: 100%;
            max-width: 380px;
            background-color: #000;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 25px 40px rgba(0,0,0,0.5);
            margin: auto;
        }

        .fondo-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.9;
        }

        .data-overlay {
            position: relative;
            background: linear-gradient(145deg, rgba(10,20,25,0.95) 0%, rgba(0,0,0,0.95) 100%);
            backdrop-filter: blur(4px);
            padding: 20px 16px;
            margin-top: -5px;
            border-top: 1px solid #00E5FF;
        }

        .league-title {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 18px;
            color: #00E5FF;
            text-transform: uppercase;
            word-break: break-word;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 12px 10px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            width: 38%;
            color: white;
        }

        .team.right {
            justify-content: flex-end;
            text-align: right;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .dot-local { background-color: #FAFF00; box-shadow: 0 0 4px #FAFF00; }
        .dot-visita { background-color: #FF3366; box-shadow: 0 0 4px #FF3366; }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            gap: 8px;
            background: #00000066;
            padding: 4px 12px;
            border-radius: 40px;
            color: #00E5FF;
        }

        .odds-section {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
        }

        .odds-title {
            text-align: center;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: #aaa;
        }

        .odd-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid #222;
            font-weight: bold;
            font-size: 14px;
        }

        .odd-row:last-child {
            border-bottom: none;
        }

        .odd-value {
            font-size: 18px;
            font-weight: bold;
            color: #FAFF00;
            font-family: monospace;
        }

        .loading {
            text-align: center;
            color: #00E5FF;
            font-size: 12px;
            padding: 10px;
            background: #000000aa;
            border-radius: 40px;
            margin-bottom: 12px;
        }

        .error-msg {
            color: #FF6666;
            text-align: center;
            font-size: 11px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="pantalla-display">
    <img class="fondo-img" src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-05%20at%2012.17.23%20PM.jpeg" alt="Mundial 2026">

    <div class="data-overlay">
        <div id="estado-carga" class="loading">🔄 Conectando a Codere...</div>
        <h3 id="titulo-liga" class="league-title">🏆 FIFA MUNDIAL 2026</h3>

        <div class="match-info">
            <div class="team">
                <span class="dot dot-local"></span>
                <span id="equipo-local">MÉXICO</span>
            </div>
            <div class="score-board">
                <span id="marcador-local">-</span>
                <span>-</span>
                <span id="marcador-visita">-</span>
            </div>
            <div class="team right">
                <span id="equipo-visita">SUDÁFRICA</span>
                <span class="dot dot-visita"></span>
            </div>
        </div>

        <div class="odds-section">
            <div class="odds-title">🎯 MOMIOS 1X2 (MEJORADOS)</div>
            <div class="odd-row">
                <span id="label-gana-local">🇲🇽 MÉXICO</span>
                <span class="odd-value" id="cuota-local">---</span>
            </div>
            <div class="odd-row">
                <span id="label-empate">🤝 EMPATE</span>
                <span class="odd-value" id="cuota-empate">---</span>
            </div>
            <div class="odd-row">
                <span id="label-gana-visita">🇿🇦 SUDÁFRICA</span>
                <span class="odd-value" id="cuota-visita">---</span>
            </div>
        </div>
        <div id="error-msg" class="error-msg"></div>
    </div>
</div>

<script>
    // IDs de las ligas del Mundial 2026 detectadas
    const MUNDIAL_LIGAS_IDS = [
        12211592397,   // FIFA Copa Mundial 2026
        12211598054,   // Partidos - Mundial 2026
        12211700413,   // Anticipadas - Mundial 2026
        12212170133,   // Grupos - Mundial 2026
        12848428644    // Especiales - Mundial 2026
    ];

    let intervaloActualizacion = null;
    let buscando = false;

    async function fetchCodere(endpoint) {
        try {
            const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
            const response = await fetch(url);
            if (response.status === 204) return null;
            const data = await response.json();
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return data;
        } catch (error) {
            console.error("fetchCodere error:", error);
            return null;
        }
    }

    // Extraer momios 1X2 de la estructura /events/{id}
    function extraerMomios1X2(eventData) {
        if (!Array.isArray(eventData)) return null;

        let gameNodeId = null;
        let resultados = [];

        for (let item of eventData) {
            if (!item.Value) continue;
            const val = item.Value;
            if (val.Type === "Game" && (val.GameType === 1 || val.GameType === 97 || val.GameType === 159)) {
                gameNodeId = val.NodeId;
            }
            if (val.Type === "Result") {
                resultados.push(val);
            }
        }

        if (!gameNodeId) return null;
        const resultadosMercado = resultados.filter(r => r.ParentNodeId === gameNodeId);
        if (resultadosMercado.length === 0) return null;

        let momioLocal = null, momioEmpate = null, momioVisitante = null;

        if (resultadosMercado.length === 2) {
            // Solo Local y Visitante (sin empate, raro en fútbol pero posible)
            momioLocal = resultadosMercado[0].Odd || resultadosMercado[0].Odds || resultadosMercado[0].Price;
            momioVisitante = resultadosMercado[1].Odd || resultadosMercado[1].Odds || resultadosMercado[1].Price;
        } else if (resultadosMercado.length >= 3) {
            momioLocal = resultadosMercado[0].Odd || resultadosMercado[0].Odds || resultadosMercado[0].Price;
            momioEmpate = resultadosMercado[1].Odd || resultadosMercado[1].Odds || resultadosMercado[1].Price;
            momioVisitante = resultadosMercado[2].Odd || resultadosMercado[2].Odds || resultadosMercado[2].Price;
        }

        if (momioLocal && typeof momioLocal === 'number') momioLocal = momioLocal.toFixed(2);
        if (momioEmpate && typeof momioEmpate === 'number') momioEmpate = momioEmpate.toFixed(2);
        if (momioVisitante && typeof momioVisitante === 'number') momioVisitante = momioVisitante.toFixed(2);

        return { momioLocal, momioEmpate, momioVisitante };
    }

    async function buscarPartidoMexicoSudafrica() {
        if (buscando) return;
        buscando = true;
        const estadoDiv = document.getElementById('estado-carga');
        const errorDiv = document.getElementById('error-msg');
        estadoDiv.style.display = 'block';
        estadoDiv.innerText = '🔍 Buscando México vs Sudáfrica...';
        errorDiv.innerText = '';

        try {
            // Recorrer cada liga del Mundial
            for (let ligaId of MUNDIAL_LIGAS_IDS) {
                estadoDiv.innerText = `📡 Revisando liga ID ${ligaId}...`;
                // Endpoint para eventos PRE-MATCH (futuros)
                const eventos = await fetchCodere(`/leagues/${ligaId}/events`);
                if (!eventos || !Array.isArray(eventos) || eventos.length === 0) continue;

                // Buscar el partido específico
                const partido = eventos.find(ev => {
                    const name = ev.Name || '';
                    return name.includes('México') && name.includes('Sudáfrica');
                });

                if (partido) {
                    estadoDiv.innerText = `✅ Partido encontrado. Cargando momios...`;
                    // Mostrar datos básicos
                    document.getElementById('titulo-liga').innerHTML = `🏆 ${partido.LeagueName || 'Mundial 2026'}`;
                    const equipos = partido.Name.split(' - ');
                    if (equipos.length >= 2) {
                        document.getElementById('equipo-local').innerText = equipos[0].trim().toUpperCase();
                        document.getElementById('equipo-visita').innerText = equipos[1].trim().toUpperCase();
                    }
                    document.getElementById('marcador-local').innerText = partido.HomeScore ?? '0';
                    document.getElementById('marcador-visita').innerText = partido.AwayScore ?? '0';

                    // Obtener momios
                    const eventData = await fetchCodere(`/events/${partido.NodeId}`);
                    const momios = extraerMomios1X2(eventData);
                    if (momios) {
                        document.getElementById('cuota-local').innerText = momios.momioLocal || 'N/D';
                        document.getElementById('cuota-empate').innerText = momios.momioEmpate || 'N/D';
                        document.getElementById('cuota-visita').innerText = momios.momioVisitante || 'N/D';
                    } else {
                        // Si no se pudo parsear, mostrar los momios que trae el evento directamente (algunos vienen en el mismo objeto)
                        if (partido.MatchOdds) {
                            document.getElementById('cuota-local').innerText = partido.MatchOdds.HomeOdds || '?';
                            document.getElementById('cuota-empate').innerText = partido.MatchOdds.DrawOdds || '?';
                            document.getElementById('cuota-visita').innerText = partido.MatchOdds.AwayOdds || '?';
                        } else {
                            document.getElementById('cuota-local').innerText = '---';
                            document.getElementById('cuota-empate').innerText = '---';
                            document.getElementById('cuota-visita').innerText = '---';
                        }
                    }

                    estadoDiv.style.display = 'none';
                    buscando = false;
                    return; // Partido encontrado, salimos
                }
            }

            // Si no se encontró en ninguna liga
            estadoDiv.innerText = '⏳ Partido no disponible aún (quizás falta tiempo)';
            errorDiv.innerText = 'El partido se cargará automáticamente cuando esté disponible en Codere.';
            document.getElementById('cuota-local').innerText = '---';
            document.getElementById('cuota-empate').innerText = '---';
            document.getElementById('cuota-visita').innerText = '---';
            buscando = false;

        } catch (error) {
            console.error(error);
            estadoDiv.innerText = '❌ Error de conexión';
            errorDiv.innerText = 'Reintentando en 30 segundos...';
            buscando = false;
        }
    }

    // Ejecutar búsqueda cada 30 segundos
    function iniciarActualizacion() {
        buscarPartidoMexicoSudafrica();
        if (intervaloActualizacion) clearInterval(intervaloActualizacion);
        intervaloActualizacion = setInterval(buscarPartidoMexicoSudafrica, 30000);
    }

    iniciarActualizacion();
</script>
</body>
</html>
