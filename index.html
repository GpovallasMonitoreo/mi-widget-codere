<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero Codere en Vivo - Selección Mexicana</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        .pantalla-display { position: relative; width: 325px; height: 960px; background-color: #000; overflow: hidden; box-shadow: 0px 0px 20px rgba(0,0,0,0.5); }
        .fondo-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Contenedor principal estilo tarjeta (Más pequeño y compacto) */
        .data-overlay { 
            position: absolute; 
            z-index: 2; 
            top: 56.5%; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 72%; 
            background-color: #1a2024; 
            border-radius: 6px; 
            padding: 12px 16px; 
            color: #FFF; 
        }

        /* Sección del Marcador */
        .match-info { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            border-bottom: 2px solid #3d4a22; 
            padding-bottom: 10px; 
            margin-bottom: 10px; 
        }
        
        .team-container { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        
        .team-name { 
            font-size: 14px; 
            font-weight: 900; 
            letter-spacing: 0.5px;
        }

        /* Puntos de colores */
        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot-local { background-color: #00C800; } 
        .dot-visita { background-color: #FFD700; } 

        /* Números del marcador */
        .score-board { 
            font-size: 24px; 
            font-weight: 900; 
            display: flex; 
            align-items: center;
        }
        .score-board .separator { margin: 0 4px; }

        /* Sección de Momios */
        .odds-title { 
            text-align: center; 
            font-size: 10px; 
            font-weight: 800;
            margin-bottom: 10px; 
            letter-spacing: 0.5px; 
        }

        .odd-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 2px solid #3d4a22; 
            padding: 8px 0; 
        }
        
        .odd-row:last-child { 
            border-bottom: none; 
            padding-bottom: 0; 
        }

        .odd-label { 
            font-size: 12px; 
            font-weight: bold; 
        }
        
        .odd-value { 
            font-size: 13px; 
            font-weight: 900; 
        }
    </style>
</head>
<body>

    <div class="pantalla-display">
        <img src="https://jxwdncxtnhmrufvdxuti.supabase.co/storage/v1/object/public/banners-publicos/WhatsApp%20Image%202026-06-05%20at%2012.17.23%20PM.jpeg" alt="Fondo Promocional" class="fondo-img">

        <div class="data-overlay" id="widget-datos">
            <div class="match-info">
                <div class="team-container">
                    <span class="dot dot-local"></span>
                    <span class="team-name">MEX</span>
                </div>
                <div class="score-board">
                    <span id="marcador-local">0</span>
                    <span class="separator">-</span>
                    <span id="marcador-visita">0</span>
                </div>
                <div class="team-container">
                    <span class="team-name">RSA</span>
                    <span class="dot dot-visita"></span>
                </div>
            </div>

            <h4 class="odds-title">OPCIONES DE APUESTA</h4>
            
            <div class="odds-section">
                <div class="odd-row">
                    <span class="odd-label">GANA MEX</span>
                    <span class="odd-value" id="cuota-local">--</span>
                </div>
                <div class="odd-row">
                    <span class="odd-label">EMPATE</span>
                    <span class="odd-value" id="cuota-empate">--</span>
                </div>
                <div class="odd-row">
                    <span class="odd-label">GANA RSA</span>
                    <span class="odd-value" id="cuota-visita">--</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MEXICO_EVENT_ID = "13177428310"; 
        let actualizacionEnProgreso = false;

        async function fetchCodere(endpoint) {
            try {
                const url = `/api/proxy?endpoint=${encodeURIComponent(endpoint)}`;
                const response = await fetch(url);
                if (response.status === 204) return null;
                const data = await response.json();
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                return data;
            } catch (error) {
                console.error("Error en fetchCodere:", error);
                return null;
            }
        }

        function procesarDataDelPartido(arrayEventos) {
            if (!Array.isArray(arrayEventos) || arrayEventos.length === 0) return null;
            
            let dataPartido = {
                marcadorLocal: 0,
                marcadorVisita: 0,
                cuotaL: "N/D",
                cuotaE: "N/D",
                cuotaV: "N/D"
            };

            const juegos = [];
            const resultados = [];

            for (let item of arrayEventos) {
                if (!item.Value) continue;
                if (item.Value.Type === "Event" && item.Value.NodeId === MEXICO_EVENT_ID) {
                    dataPartido.marcadorLocal = item.Value.HomeScore != null ? item.Value.HomeScore : 0;
                    dataPartido.marcadorVisita = item.Value.AwayScore != null ? item.Value.AwayScore : 0;
                } else if (item.Value.Type === "Game") {
                    juegos.push(item.Value);
                } else if (item.Value.Type === "Result") {
                    resultados.push(item.Value);
                }
            }

            let mercadoPrincipal = juegos.find(j => j.GameType === 1 || j.GameType === 97 || j.GameType === 159);
            
            if (!mercadoPrincipal) {
                mercadoPrincipal = juegos.find(j => j.NodeName && j.NodeName.toUpperCase().includes("RESULTADO"));
            }

            if (mercadoPrincipal) {
                const resultadosMercado = resultados.filter(r => r.ParentNodeId === mercadoPrincipal.NodeId);
                
                resultadosMercado.sort((a, b) => {
                    let orderA = 99, orderB = 99;
                    try {
                        orderA = parseInt(a.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                        orderB = parseInt(b.AdditionalValues.LocalizedValues.find(v => v.Key === "ParticipantOrder").Value);
                    } catch(e){}
                    return orderA - orderB;
                });

                if (resultadosMercado.length >= 3) {
                    let cL = resultadosMercado[0].Odd || resultadosMercado[0].Price || "N/D";
                    let cE = resultadosMercado[1].Odd || resultadosMercado[1].Price || "N/D";
                    let cV = resultadosMercado[2].Odd || resultadosMercado[2].Price || "N/D";

                    dataPartido.cuotaL = typeof cL === 'number' ? cL.toFixed(2) : cL;
                    dataPartido.cuotaE = typeof cE === 'number' ? cE.toFixed(2) : cE;
                    dataPartido.cuotaV = typeof cV === 'number' ? cV.toFixed(2) : cV;
                }
            }

            return dataPartido;
        }

        async function actualizarDatosMexico() {
            if (actualizacionEnProgreso) return;
            actualizacionEnProgreso = true;

            try {
                const arrayEventos = await fetchCodere(`/events/${MEXICO_EVENT_ID}`);
                const datos = procesarDataDelPartido(arrayEventos);

                if (datos) {
                    document.getElementById('marcador-local').innerText = datos.marcadorLocal;
                    document.getElementById('marcador-visita').innerText = datos.marcadorVisita;
                    
                    document.getElementById('cuota-local').innerText = datos.cuotaL;
                    document.getElementById('cuota-empate').innerText = datos.cuotaE;
                    document.getElementById('cuota-visita').innerText = datos.cuotaV;
                }
            } catch (error) {
                console.error("Error al actualizar datos: ", error);
            } finally {
                actualizacionEnProgreso = false;
            }
        }

        actualizarDatosMexico();
        setInterval(actualizarDatosMexico, 30000);
    </script>
</body>
</html>
